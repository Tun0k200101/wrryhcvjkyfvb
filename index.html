<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Меню · подбор и рецепты</title>
<style>
:root{
  --primary:#16a34a; --primary-dark:#15803d; --primary-soft:#dcfce7;
  --accent:#f59e0b; --accent-soft:#fef3c7;
  --bg:#faf9f7; --card:#ffffff; --text:#0f172a; --text-soft:#334155;
  --muted:#64748b; --border:#e8e6e3; --radius:18px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
  --shadow-md:0 4px 12px -2px rgba(15,23,42,.08), 0 12px 32px -8px rgba(15,23,42,.10);
  --shadow-lg:0 20px 60px -12px rgba(15,23,42,.20);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
button{font-family:inherit}

/* ─── Hero ─── */
.hero{
  background:
    radial-gradient(1200px 400px at 0% -20%, #bbf7d0 0%, transparent 60%),
    radial-gradient(800px 300px at 100% 0%, #fef3c7 0%, transparent 55%),
    linear-gradient(135deg, #ffffff 0%, #f3fbf5 100%);
  border-bottom:1px solid var(--border);
  padding:36px 20px 28px;
}
.hero-inner{max-width:860px;margin:0 auto}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:#fff; border:1px solid var(--border);
  padding:6px 12px; border-radius:99px;
  font-size:12.5px; color:var(--text-soft); font-weight:500;
  box-shadow:var(--shadow-sm); margin-bottom:16px;
}
.hero-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.hero h1{
  font-size:clamp(24px,4vw,34px); margin:0 0 8px; letter-spacing:-0.02em;
  line-height:1.15; font-weight:800;
}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--primary),#10b981);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:15px;max-width:560px}

/* ─── Layout ─── */
.app{max-width:860px;margin:0 auto;padding:0 20px 140px}
.progress-wrap{padding:20px 0 4px}
.steps{display:flex;align-items:center;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.step-dot{
  display:flex;align-items:center;gap:8px;
  padding:7px 14px 7px 7px; border-radius:99px;
  font-size:13px; color:var(--muted); font-weight:500;
  background:transparent; border:1px solid transparent;
  transition:.2s;
}
.step-dot.active{background:#fff;border-color:var(--border);color:var(--text);box-shadow:var(--shadow-sm)}
.step-dot.done{color:var(--primary-dark)}
.step-num{
  width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;font-size:12px;font-weight:700;
  background:#e7e5e4;color:var(--muted);flex:0 0 auto;
  transition:.2s;
}
.step-dot.active .step-num{background:var(--primary);color:#fff}
.step-dot.done .step-num{background:var(--primary-soft);color:var(--primary-dark)}

/* ─── Typography ─── */
h2{font-size:22px;margin:0 0 6px;letter-spacing:-0.015em;font-weight:700}
h3{font-size:16px;margin:28px 0 12px;letter-spacing:-0.01em}
.hint{color:var(--muted);font-size:14.5px;margin:0 0 20px;line-height:1.55}
.field-label{font-size:12.5px;color:var(--muted);margin:18px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* ─── Option cards ─── */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.option{
  display:flex;align-items:center;gap:11px;
  padding:14px 15px;border:1.5px solid var(--border);
  background:#fff;border-radius:14px;cursor:pointer;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  font:inherit;color:inherit;text-align:left;
  box-shadow:var(--shadow-sm);
}
.option:hover{border-color:#d4d2ce;transform:translateY(-1px);box-shadow:var(--shadow-md)}
.option.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px rgba(22,163,74,.10)}
.option .emoji{font-size:20px;line-height:1}
.option .name{font-weight:500;font-size:14.5px}
.option .check{
  margin-left:auto;width:20px;height:20px;border-radius:50%;
  border:2px solid var(--border);flex:0 0 auto;
  display:grid;place-items:center;font-size:11px;color:#fff;line-height:1;
  transition:.18s;
}
.option.active .check{background:var(--primary);border-color:var(--primary)}

/* ─── Chips ─── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:9px 16px;border-radius:99px;border:1.5px solid var(--border);
  background:#fff;cursor:pointer;font:inherit;font-size:14px;
  transition:all .15s;color:var(--text-soft);font-weight:500;
}
.chip:hover{border-color:#d4d2ce;color:var(--text)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px -2px rgba(22,163,74,.35)}
.link{
  display:inline-block;margin-top:12px;background:none;border:none;padding:0;
  color:var(--primary);font:inherit;font-size:13.5px;font-weight:500;
  cursor:pointer;text-decoration:none;border-bottom:1px dashed currentColor;
}

/* ─── Budget ─── */
.budget-card{
  background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);
  padding:26px;box-shadow:var(--shadow-md);
}
.budget-value{
  font-size:44px;font-weight:800;line-height:1;margin-bottom:20px;
  letter-spacing:-0.03em;
  background:linear-gradient(135deg,var(--primary),#059669);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.budget-value small{font-size:18px;font-weight:600;color:var(--muted);-webkit-text-fill-color:var(--muted)}
input[type=range]{
  width:100%;accent-color:var(--primary);height:28px;cursor:pointer;
  background:transparent;
}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:#e7e5e4;border-radius:99px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;border:3px solid var(--primary);
  box-shadow:0 2px 8px rgba(22,163,74,.30);margin-top:-8px;cursor:grab;
}
input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.08)}
input[type=range]::-moz-range-track{height:6px;background:#e7e5e4;border-radius:99px}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:#fff;
  border:3px solid var(--primary);cursor:grab;
}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ─── Summary ─── */
.summary{
  background:linear-gradient(135deg,#f0fdf4 0%,#f8fafc 100%);
  border:1px solid var(--primary-soft);border-radius:var(--radius);
  padding:16px 18px;font-size:14px;line-height:1.7;color:var(--text-soft);
}
.summary b{color:var(--text);font-weight:600}

/* ─── Stats ─── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.stat{
  background:#fff;border:1.5px solid var(--border);border-radius:14px;
  padding:16px 18px;box-shadow:var(--shadow-sm);
}
.stat-val{
  font-size:22px;font-weight:800;line-height:1.1;margin-bottom:6px;
  word-break:break-word;letter-spacing:-0.02em;color:var(--primary-dark);
}
.stat-val.big{font-size:18px}
.stat-lbl{font-size:12px;color:var(--muted);line-height:1.4}

/* ─── Menu card ─── */
.menu-card{
  background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow-sm);
  transition:.2s;
}
.menu-card:hover{box-shadow:var(--shadow-md)}
.menu-head{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:14px;flex-wrap:wrap;
}
.menu-head-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.menu-head-price{
  font-weight:800;font-size:18px;color:var(--primary-dark);
  letter-spacing:-0.02em;
}
.menu-head-price small{font-size:12px;font-weight:500;color:var(--muted);margin-right:4px}
.menu-day{
  font-size:11.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin:12px 0 6px;font-weight:700;
}
.menu-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 0;font-size:14px;border-bottom:1px dashed var(--border);
  cursor:pointer;transition:.15s;
}
.menu-item:hover{color:var(--primary-dark)}
.menu-item:last-child{border-bottom:none}
.menu-item .item-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.menu-item .type-tag{
  font-size:10.5px;font-weight:600;color:var(--muted);
  background:#f1f5f9;padding:3px 8px;border-radius:6px;text-transform:uppercase;
  letter-spacing:.04em;white-space:nowrap;
}
.menu-item .dish-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-item .price{white-space:nowrap;color:var(--muted);font-size:13px;font-weight:500}
.btn-shopping{
  margin-top:12px;width:100%;padding:10px;
  border:1.5px dashed var(--primary);background:var(--primary-soft);
  color:var(--primary-dark);border-radius:10px;font:inherit;
  font-size:13.5px;font-weight:600;cursor:pointer;transition:.18s;
}
.btn-shopping:hover{background:#c6f6d5}

/* ─── Dish cards ─── */
.cat-header{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;color:var(--text-soft);
  margin:24px 0 10px;text-transform:uppercase;letter-spacing:.05em;
}
.cat-header .count{
  background:#f1f5f9;color:var(--muted);padding:2px 8px;
  border-radius:99px;font-size:11px;font-weight:600;
}
.dish{
  display:flex;align-items:center;gap:13px;
  padding:12px 14px;background:#fff;
  border:1.5px solid var(--border);border-radius:14px;
  margin-bottom:8px;cursor:pointer;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--shadow-sm);
}
.dish:hover{border-color:#d4d2ce;transform:translateY(-1px);box-shadow:var(--shadow-md)}
.dish-emoji{
  width:44px;height:44px;flex:0 0 auto;border-radius:12px;
  display:grid;place-items:center;font-size:24px;
  background:linear-gradient(135deg,#f0fdf4,#fef3c7);
}
.dish-body{flex:1;min-width:0}
.dish-name{font-weight:600;font-size:14.5px;margin-bottom:3px;letter-spacing:-0.01em}
.dish-meta{
  color:var(--muted);font-size:12px;line-height:1.4;
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
}
.dish-meta span{display:inline-flex;align-items:center;gap:3px}
.dish-price{
  font-weight:800;font-size:15px;white-space:nowrap;
  color:var(--primary-dark);letter-spacing:-0.01em;
}

/* ─── Empty ─── */
.empty{
  text-align:center;padding:44px 24px;color:var(--muted);
  background:#fff;border-radius:var(--radius);border:1.5px dashed var(--border);
  font-size:14px;line-height:1.6;
}
.empty .emoji{font-size:36px;display:block;margin-bottom:10px}

/* ─── Footer ─── */
.footer{
  position:fixed;left:0;right:0;bottom:0;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  z-index:50;
}
.footer-inner{max-width:860px;margin:0 auto;display:flex;gap:10px}
.btn-primary{
  flex:1;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;
  transition:.18s;box-shadow:0 4px 14px -4px rgba(22,163,74,.45);
  letter-spacing:-0.01em;
}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px -4px rgba(22,163,74,.55)}
.btn-primary:disabled{background:#cbd5e1;box-shadow:none;cursor:not-allowed;transform:none}
.btn-ghost{
  padding:14px 20px;border-radius:12px;
  border:1.5px solid var(--border);background:#fff;
  font:inherit;font-size:15px;font-weight:600;cursor:pointer;
  color:var(--text-soft);transition:.15s;
}
.btn-ghost:hover:not(:disabled){border-color:#d4d2ce}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed}

/* ─── Modal ─── */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;
  background:rgba(15,23,42,.45);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;
  padding:0;opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal-backdrop.show{opacity:1;pointer-events:auto}
@media(min-width:640px){
  .modal-backdrop{align-items:center;padding:24px}
}
.modal{
  background:#fff;width:100%;max-width:640px;max-height:92vh;
  border-radius:24px 24px 0 0;overflow:hidden;
  display:flex;flex-direction:column;
  transform:translateY(24px) scale(.98);opacity:0;
  transition:transform .28s cubic-bezier(.34,1.3,.64,1),opacity .22s;
  box-shadow:var(--shadow-lg);position:relative;
}
@media(min-width:640px){.modal{border-radius:24px}}
.modal-backdrop.show .modal{transform:translateY(0) scale(1);opacity:1}
.modal-close{
  position:absolute;top:14px;right:14px;z-index:2;
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(255,255,255,.9);backdrop-filter:blur(8px);
  font-size:20px;line-height:1;cursor:pointer;
  display:grid;place-items:center;color:var(--text-soft);
  box-shadow:var(--shadow-sm);transition:.15s;
}
.modal-close:hover{background:#fff;transform:scale(1.05)}
.modal-hero{
  background:
    radial-gradient(600px 200px at 30% 0%, #dcfce7 0%, transparent 70%),
    radial-gradient(400px 200px at 80% 40%, #fef3c7 0%, transparent 70%),
    linear-gradient(135deg,#f9fafb,#f3fbf5);
  padding:28px 24px 22px;
  display:flex;align-items:center;gap:16px;
  border-bottom:1px solid var(--border);
}
.modal-hero-emoji{
  width:70px;height:70px;flex:0 0 auto;border-radius:20px;
  display:grid;place-items:center;font-size:40px;
  background:#fff;box-shadow:var(--shadow-md);
}
.modal-hero-text{flex:1;min-width:0}
.modal-hero-text h3{
  margin:0 0 6px;font-size:20px;letter-spacing:-0.02em;
  color:var(--text);font-weight:800;line-height:1.2;
}
.modal-hero-tags{
  display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);
}
.modal-hero-tags span{
  background:rgba(255,255,255,.85);padding:3px 8px;border-radius:6px;
  font-weight:500;border:1px solid rgba(0,0,0,.04);
}
.modal-body{padding:20px 24px 28px;overflow-y:auto;flex:1}
.modal-stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin-bottom:22px;
}
.modal-stat{
  text-align:center;background:#f8fafc;border-radius:12px;
  padding:10px 6px;border:1px solid var(--border);
}
.modal-stat-val{font-weight:700;font-size:15px;color:var(--text);letter-spacing:-0.01em}
.modal-stat-lbl{font-size:10.5px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.modal-section-title{
  font-size:12px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px;
}
.modal-ing{
  list-style:none;padding:0;margin:0 0 24px;
  background:#fafaf9;border-radius:14px;padding:6px 4px;
  border:1px solid var(--border);
}
.modal-ing li{
  display:flex;justify-content:space-between;gap:10px;
  padding:9px 14px;font-size:14px;border-bottom:1px dashed var(--border);
}
.modal-ing li:last-child{border-bottom:none}
.modal-ing .ing-name{color:var(--text-soft)}
.modal-ing .ing-amt{color:var(--muted);font-weight:500;white-space:nowrap;font-size:13px}
.modal-steps{list-style:none;counter-reset:step;padding:0;margin:0}
.modal-steps li{
  counter-increment:step;position:relative;
  padding:0 0 16px 40px;font-size:14.5px;line-height:1.6;color:var(--text-soft);
}
.modal-steps li::before{
  content:counter(step);position:absolute;left:0;top:0;
  width:26px;height:26px;border-radius:50%;
  background:var(--primary-soft);color:var(--primary-dark);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;
}
.modal-steps li:not(:last-child)::after{
  content:'';position:absolute;left:13px;top:30px;bottom:0;
  width:1px;background:var(--border);
}
.modal-ing-title{margin-bottom:10px}
.shopping-list .modal-ing li{font-size:13.5px}
.shopping-total{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:14px;padding:12px 16px;
  background:var(--primary-soft);border-radius:12px;
  font-weight:700;font-size:15px;color:var(--primary-dark);
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-badge">Рецепты · цены · список покупок</div>
    <h1>Собери меню <em>под себя</em></h1>
    <p>Выберите магазины, отметьте аллергии и нелюбимые продукты — получите готовые меню с рецептами в рамках бюджета.</p>
  </div>
</header>

<div class="app">
  <div class="progress-wrap">
    <div class="steps" id="steps"></div>
  </div>
  <main id="main"></main>
</div>

<div class="footer">
  <div class="footer-inner">
    <button class="btn-ghost" id="back">Назад</button>
    <button class="btn-primary" id="next">Далее</button>
  </div>
</div>

<div class="modal-backdrop" id="modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>

    ing:[{p:'potato',g:300},{p:'carrot',g:150},{p:'egg',g:3},{p:'peas_can',g:1},{p:'cucumber',g:150},{p:'chicken_breast',g:300},{p:'sour_cream',g:80},{p:'salt',g:3}],
    steps:['Отварите картофель, морковь, яйца и курицу.','Нарежьте всё мелкими кубиками.','Добавьте горошек и нарезанные огурцы.','Заправьте сметаной, посолите, перемешайте.'],
    allergens:['milk','eggs'], tags:['chicken','meat']},

  {id:'vinaigrette', name:'Винегрет', emoji:'🥗', cat:'salad',
    time:50, servings:4, kcal:150, difficulty:'легко',
    ing:[{p:'beet',g:250},{p:'potato',g:200},{p:'carrot',g:150},{p:'peas_can',g:1},{p:'cabbage',g:150},{p:'oil_sun',g:20},{p:'salt',g:3}],
    steps:['Отварите свёклу, картофель и морковь до готовности.','Остудите и нарежьте кубиками.','Добавьте квашеную капусту и горошек.','Заправьте маслом, посолите.'],
    allergens:[], tags:['veg']},

  {id:'cabbage_salad', name:'Салат из капусты с морковью', emoji:'🥗', cat:'salad',
    time:10, servings:2, kcal:90, difficulty:'легко',
    ing:[{p:'cabbage',g:300},{p:'carrot',g:100},{p:'oil_sun',g:15},{p:'salt',g:2}],
    steps:['Тонко нашинкуйте капусту.','Натрите морковь на крупной тёрке.','Смешайте, посолите, заправьте маслом, помните руками.'],
    allergens:[], tags:['veg']},
];

/* ═════════════ ФИЛЬТРЫ ═════════════ */
const ALLERGENS = [
  {id:'nuts',name:'Орехи'},{id:'milk',name:'Молоко'},{id:'gluten',name:'Глютен'},
  {id:'eggs',name:'Яйца'},{id:'soy',name:'Соя'},{id:'fish',name:'Рыба'},{id:'seafood',name:'Морепродукты'},
];
const EXCLUDES = [
  {id:'fish',name:'Рыба'},{id:'seafood',name:'Морепродукты'},{id:'pork',name:'Свинина'},
  {id:'beef',name:'Говядина'},{id:'chicken',name:'Курица'},{id:'meat',name:'Любое мясо'},
  {id:'spicy',name:'Острое'},{id:'mushrooms',name:'Грибы'},{id:'veg',name:'Только вегетарианское'},
];

/* ═════════════ СОСТОЯНИЕ ═════════════ */
const state = {
  step:0, stores:[], allergies:[], exclude:[],
  budget:5000, days:3,
  samples:[], sampleKey:'',
};
const DAY_OPTIONS = [1,3,7];
const money = n => new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽';
const toggle = (arr,v) => { const i=arr.indexOf(v); i===-1?arr.push(v):arr.splice(i,1); };
const nameOf = (list,id) => (list.find(x=>x.id===id)||{}).name || id;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

/* Форматирование количества продукта */
function fmtAmount(prod, g) {
  if (prod.unit === 'piece') return Math.round(g) + ' шт';
  if (prod.unit === 'L' && g < 1000) return g + ' мл';
  return g >= 1000 ? (g/1000).toFixed(1).replace('.0','') + ' кг' : g + ' г';
}

/* ═════════════ ЦЕНЫ ═════════════ */
function recipePrice(recipe, storeId) {
  const mult = (STORES.find(s=>s.id===storeId)||{mult:1}).mult;
  let total = 0;
  for (const ing of recipe.ing) {
    const prod = PRODUCTS[ing.p]; if (!prod) continue;
    if (prod.unit === 'piece') total += ing.g * prod.price;
    else total += (ing.g/1000) * prod.price;
  }
  return Math.round(total * mult / 10) * 10;
}
function cheapestPrice(recipe) {
  if (!state.stores.length) return 0;
  return Math.min(...state.stores.map(sid => recipePrice(recipe, sid)));
}

/* ═════════════ ФИЛЬТРАЦИЯ ═════════════ */
function filterRecipes() {
  return RECIPES
    .filter(r => !r.allergens.some(a => state.allergies.includes(a)))
    .filter(r => !r.tags.some(t => state.exclude.includes(t)))
    .map(r => ({...r, price: cheapestPrice(r)}));
}

/* ═════════════ СБОРКА МЕНЮ ═════════════ */
function buildSamples(valid, days, budget, count=4) {
  const byCat = {
    breakfast: valid.filter(r=>r.cat==='breakfast'),
    soup:      valid.filter(r=>r.cat==='soup'),
    main:      valid.filter(r=>r.cat==='main'),
    salad:     valid.filter(r=>r.cat==='salad'),
  };
  if (Object.values(byCat).some(a => !a.length)) return [];

  const results = [];
  const seen = new Set();
  for (let i = 0; i < 6000 && results.length < count; i++) {
    const plan = []; let total = 0;
    for (let d = 0; d < days; d++) {
      const day = [
        {type:'Завтрак', dish: pick(byCat.breakfast)},
        {type:'Суп',     dish: pick(byCat.soup)},
        {type:'Горячее', dish: pick(byCat.main)},
        {type:'Салат',   dish: pick(byCat.salad)},
      ];
      plan.push(day);
      for (const x of day) total += x.dish.price;
    }
    if (total > budget || total < budget * 0.5) continue;
    const key = plan.flatMap(d => d.map(x => x.dish.id)).sort().join('|');
    if (seen.has(key)) continue;
    seen.add(key);
    results.push({plan, total});
  }
  return results;
}

/* ═════════════ РЕНДЕР ШАГОВ ═════════════ */
const STEPS_RENDER = [renderStores, renderAllergies, renderExcludes, renderBudget];
const STEP_LABELS = ['Магазины', 'Аллергии', 'Исключения', 'Бюджет'];

function renderStepIndicator() {
  const el = document.getElementById('steps');
  el.innerHTML = STEP_LABELS.map((label, i) => {
    const cls = i === state.step ? 'active' : (i < state.step ? 'done' : '');
    const num = i < state.step ? '✓' : String(i+1);
    return `<div class="step-dot ${cls}"><span class="step-num">${num}</span>${label}</div>`;
  }).join('');
}

function renderStores() {
  const all = state.stores.length === STORES.length;
  return `
    <h2>Где закупаемся?</h2>
    <p class="hint">Выберите один или несколько магазинов. Цена блюда считается по ингредиентам — берём самую выгодную среди ваших магазинов.</p>
    <div class="grid">
      ${STORES.map(s => {
        const on = state.stores.includes(s.id);
        return `<button class="option ${on?'active':''}" data-act="store" data-val="${s.id}">
          <span class="emoji">${s.emoji}</span>
          <span class="name">${s.name}</span>
          <span class="check">${on?'✓':''}</span>
        </button>`;
      }).join('')}
    </div>
    <button class="link" data-act="allstores">${all ? 'Снять выбор' : 'Выбрать все'}</button>
  `;
}

function renderAllergies() {
  return `
    <h2>Есть аллергии?</h2>
    <p class="hint">Блюда с этими аллергенами исключим полностью. Нет аллергий — жмите «Далее».</p>
    <div class="chips">
      ${ALLERGENS.map(a => `<button class="chip ${state.allergies.includes(a.id)?'active':''}" data-act="allergy" data-val="${a.id}">${a.name}</button>`).join('')}
    </div>
  `;
}

function renderExcludes() {
  return `
    <h2>Чего не хотите в меню?</h2>
    <p class="hint">Продукты и вкусы, которые не любите.</p>
    <div class="chips">
      ${EXCLUDES.map(a => `<button class="chip ${state.exclude.includes(a.id)?'active':''}" data-act="exclude" data-val="${a.id}">${a.name}</button>`).join('')}
    </div>
  `;
}

function renderBudget() {
  const quick = [1000, 3000, 5000, 10000, 25000];
  return `
    <h2>Бюджет и длина плана</h2>
    <p class="hint">Сумма — на весь план. В день 4 блюда: завтрак, суп, горячее, салат.</p>
    <div class="budget-card">
      <div class="budget-value" id="budgetValue">${state.budget} <small>₽</small></div>
      <input type="range" id="budgetRange" min="1000" max="25000" step="500" value="${state.budget}">
      <div class="quick">
        ${quick.map(v => `<button class="chip ${state.budget===v?'active':''}" data-act="budget" data-val="${v}">${v} ₽</button>`).join('')}
      </div>
    </div>
    <p class="field-label">Длина плана</p>
    <div class="chips">
      ${DAY_OPTIONS.map(d => `<button class="chip ${state.days===d?'active':''}" data-act="days" data-val="${d}">${d} ${d===1?'день':d<5?'дня':'дней'}</button>`).join('')}
    </div>
  `;
}

function renderResults() {
  const valid = filterRecipes();
  const byCat = {
    breakfast: valid.filter(r=>r.cat==='breakfast'),
    soup:      valid.filter(r=>r.cat==='soup'),
    main:      valid.filter(r=>r.cat==='main'),
    salad:     valid.filter(r=>r.cat==='salad'),
  };

  const chips = [];
  chips.push('Магазины: <b>' + (state.stores.length ? state.stores.map(s=>nameOf(STORES,s)).join(', ') : '—') + '</b>');
  chips.push('Аллергии: <b>' + (state.allergies.length ? state.allergies.map(a=>nameOf(ALLERGENS,a)).join(', ') : 'нет') + '</b>');
  chips.push('Исключено: <b>' + (state.exclude.length ? state.exclude.map(a=>nameOf(EXCLUDES,a)).join(', ') : 'ничего') + '</b>');
  chips.push('Бюджет: <b>' + money(state.budget) + '</b> · план: <b>' + state.days + ' ' + (state.days===1?'день':state.days<5?'дня':'дней') + '</b>');

  if (!valid.length) {
    return `
      <h2>Ничего не нашлось 😔</h2>
      <div class="summary">${chips.join('<br>')}</div>
      <div class="empty" style="margin-top:16px"><span class="emoji">🔎</span>Попробуйте увеличить бюджет, добавить магазин или убрать один из фильтров.</div>
    `;
  }

  // кэшируем сэмплы
  const key = [state.stores.join(','), state.allergies.join(','), state.exclude.join(','), state.budget, state.days].join('#');
  if (key !== state.sampleKey) {
    state.samples = buildSamples(valid, state.days, state.budget, 4);
    state.sampleKey = key;
  }

  const perDay = BigInt(byCat.breakfast.length) * BigInt(byCat.soup.length) * BigInt(byCat.main.length) * BigInt(byCat.salad.length);
  const totalCombos = perDay > 0n ? perDay ** BigInt(state.days) : 0n;

  return `
    <h2>Готово · ${valid.length} блюд</h2>
    <div class="summary">${chips.join('<br>')}</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-val">${perDay.toLocaleString('ru-RU')}</div>
        <div class="stat-lbl">комбинаций на 1 день</div>
      </div>
      <div class="stat">
        <div class="stat-val big">${totalCombos.toLocaleString('ru-RU')}</div>
        <div class="stat-lbl">комбинаций на план · ${state.days} дн.</div>
      </div>
      <div class="stat">
        <div class="stat-val">${valid.length}</div>
        <div class="stat-lbl">блюд после фильтров</div>
      </div>
    </div>

    <h3>🍽 Примеры меню · нажмите на блюдо для рецепта</h3>
    ${state.samples.length ? state.samples.map((s, idx) => renderSample(s, idx)).join('')
      : `<div class="empty"><span class="emoji">💸</span>В этот бюджет примеры не помещаются. Увеличьте бюджет или сократите план.</div>`}

    <h3>📖 Все доступные блюда</h3>
    ${['breakfast','soup','main','salad'].map(cat => {
      const label = {breakfast:'Завтраки', soup:'Супы', main:'Горячее', salad:'Салаты'}[cat];
      const list = byCat[cat].slice().sort((a,b)=>a.price-b.price);
      if (!list.length) return '';
      return `
        <div class="cat-header">${label}<span class="count">${list.length}</span></div>
        ${list.map(d => renderDishCard(d)).join('')}
      `;
    }).join('')}
  `;
}

function renderSample(sample, idx) {
  return `
    <div class="menu-card">
      <div class="menu-head">
        <div class="menu-head-title">Вариант ${idx+1} · ${state.days} ${state.days===1?'день':state.days<5?'дня':'дней'}</div>
        <div class="menu-head-price"><small>итого</small>${money(sample.total)}</div>
      </div>
      ${sample.plan.map((day, i) => `
        ${state.days > 1 ? `<div class="menu-day">День ${i+1}</div>` : ''}
        ${day.map(x => `
          <div class="menu-item" data-act="openRecipe" data-val="${x.dish.id}">
            <div class="item-left">
              <span class="type-tag">${x.type}</span>
              <span class="dish-name">${x.dish.emoji} ${x.dish.name}</span>
            </div>
            <span class="price">${money(x.dish.price)}</span>
          </div>
        `).join('')}
      `).join('')}
      <button class="btn-shopping" data-act="openShopping" data-val="${idx}">
        🧾 Список покупок
      </button>
    </div>
  `;
}

function renderDishCard(d) {
  return `
    <div class="dish" data-act="openRecipe" data-val="${d.id}">
      <div class="dish-emoji">${d.emoji}</div>
      <div class="dish-body">
        <div class="dish-name">${d.name}</div>
        <div class="dish-meta">
          <span>⏱ ${d.time} мин</span>
          <span>🍽 ${d.servings} порц.</span>
          <span>🔥 ${d.kcal} ккал</span>
        </div>
      </div>
      <div class="dish-price">${money(d.price)}</div>
    </div>
  `;
}

/* ═════════════ МОДАЛКА ═════════════ */
const modal = document.getElementById('modal');
const modalContent = document.getElementById('modalContent');
const modalClose = document.getElementById('modalClose');

function openModal(html) {
  modalContent.innerHTML = html;
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  setTimeout(() => { if (!modal.classList.contains('show')) modalContent.innerHTML = ''; }, 300);
}
modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('show')) closeModal(); });

function openRecipe(id) {
  const dish = RECIPES.find(r => r.id === id);
  if (!dish) return;
  const price = cheapestPrice(dish);
  const stores = state.stores.map(sid => ({
    name: nameOf(STORES, sid),
    price: recipePrice(dish, sid),
  })).sort((a,b)=>a.price-b.price);

  const html = `
    <div class="modal-hero">
      <div class="modal-hero-emoji">${dish.emoji}</div>
      <div class="modal-hero-text">
        <h3>${dish.name}</h3>
        <div class="modal-hero-tags">
          <span>${money(price)}</span>
          <span>${dish.difficulty}</span>
          <span>${state.stores.length ? 'в ' + (stores.length>1?'магазинах':stores[0].name.toLowerCase()) : 'выберите магазин'}</span>
        </div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-stats">
        <div class="modal-stat"><div class="modal-stat-val">${dish.time}</div><div class="modal-stat-lbl">мин</div></div>
        <div class="modal-stat"><div class="modal-stat-val">${dish.servings}</div><div class="modal-stat-lbl">порции</div></div>
        <div class="modal-stat"><div class="modal-stat-val">${dish.kcal}</div><div class="modal-stat-lbl">ккал</div></div>
        <div class="modal-stat"><div class="modal-stat-val">${dish.ing.length}</div><div class="modal-stat-lbl">ингр.</div></div>
      </div>

      <p class="modal-section-title modal-ing-title">Ингредиенты · ${dish.servings} ${dish.servings===1?'порция':dish.servings<5?'порции':'порций'}</p>
      <ul class="modal-ing">
        ${dish.ing.map(i => {
          const p = PRODUCTS[i.p];
          return `<li><span class="ing-name">${p.name}</span><span class="ing-amt">${fmtAmount(p, i.g)}</span></li>`;
        }).join('')}
      </ul>

      <p class="modal-section-title">Приготовление</p>
      <ol class="modal-steps">
        ${dish.steps.map(s => `<li>${s}</li>`).join('')}
      </ol>

      ${stores.length > 1 ? `
        <p class="modal-section-title" style="margin-top:20px">Цена по магазинам</p>
        <ul class="modal-ing">
          ${stores.map(s => `<li><span class="ing-name">${s.name}</span><span class="ing-amt">${money(s.price)}</span></li>`).join('')}
        </ul>
      ` : ''}
    </div>
  `;
  openModal(html);
}

function openShoppingList(sampleIdx) {
  const sample = state.samples[sampleIdx];
  if (!sample) return;
  const agg = {};
  for (const day of sample.plan) {
    for (const item of day) {
      for (const ing of item.dish.ing) {
        agg[ing.p] = (agg[ing.p] || 0) + ing.g;
      }
    }
  }
  const entries = Object.entries(agg).sort((a,b) => a[0].localeCompare(b[0]));

  // стоимость по самому дешёвому магазину
  let total = 0;
  const store = state.stores.map(sid => ({
    name: nameOf(STORES, sid),
    price: entries.reduce((sum, [pid, g]) => {
      const p = PRODUCTS[pid];
      const mult = (STORES.find(s => s.id === sid) || {mult:1}).mult;
      const base = p.unit === 'piece' ? g * p.price : (g/1000) * p.price;
      return sum + base * mult;
    }, 0),
  })).sort((a,b) => a.price - b.price)[0];

  if (store) total = store.price;

  const html = `
    <div class="modal-hero">
      <div class="modal-hero-emoji">🧾</div>
      <div class="modal-hero-text">
        <h3>Список покупок</h3>
        <div class="modal-hero-tags">
          <span>${state.days} ${state.days===1?'день':state.days<5?'дня':'дней'}</span>
          <span>${entries.length} позиций</span>
          ${store ? `<span>${store.name}</span>` : ''}
        </div>
      </div>
    </div>
    <div class="modal-body shopping-list">
      <ul class="modal-ing">
        ${entries.map(([pid, g]) => {
          const p = PRODUCTS[pid];
          return `<li><span class="ing-name">${p.name}</span><span class="ing-amt">${fmtAmount(p, g)}</span></li>`;
        }).join('')}
      </ul>
      ${store ? `<div class="shopping-total"><span>Примерно</span><span>${money(total)}</span></div>` : ''}
    </div>
  `;
  openModal(html);
}

/* ═════════════ НАВИГАЦИЯ ═════════════ */
const main = document.getElementById('main');
const backBtn = document.getElementById('back');
const nextBtn = document.getElementById('next');

const canGoNext = () => state.step === 0 ? state.stores.length > 0 : true;

function render() {
  renderStepIndicator();
  main.innerHTML = state.step === 4 ? renderResults() : STEPS_RENDER[state.step]();

  if (state.step === 4) {
    backBtn.textContent = 'Заново';
    nextBtn.textContent = 'Изменить условия';
  } else {
    backBtn.textContent = 'Назад';
    backBtn.disabled = state.step === 0;
    nextBtn.textContent = state.step === 3 ? 'Подобрать' : 'Далее';
    nextBtn.disabled = !canGoNext();
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

nextBtn.addEventListener('click', () => {
  if (state.step === 4) { state.step = 0; render(); return; }
  if (state.step === 3) { state.step = 4; render(); return; }
  state.step++; render();
});
backBtn.addEventListener('click', () => {
  if (state.step === 4) { state.step = 0; render(); return; }
  if (state.step > 0) { state.step--; render(); }
});

main.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, val } = el.dataset;
  if (act === 'store')     { toggle(state.stores, val); render(); }
  if (act === 'allergy')   { toggle(state.allergies, val); render(); }
  if (act === 'exclude')   { toggle(state.exclude, val); render(); }
  if (act === 'budget')    { state.budget = +val; render(); }
  if (act === 'days')      { state.days = +val; render(); }
  if (act === 'allstores') { state.stores = state.stores.length === STORES.length ? [] : STORES.map(s => s.id); render(); }
  if (act === 'openRecipe')    openRecipe(val);
  if (act === 'openShopping')  openShoppingList(+val);
});

main.addEventListener('input', e => {
  if (e.target.id !== 'budgetRange') return;
  state.budget = +e.target.value;
  document.getElementById('budgetValue').innerHTML = state.budget + ' <small>₽</small>';
  main.querySelectorAll('[data-act="budget"]').forEach(b => {
    b.classList.toggle('active', +b.dataset.val === state.budget);
  });
});

render();
</script>
