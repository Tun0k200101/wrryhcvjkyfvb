<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Меню · конструктор</title>
<style>
:root{
  --primary:#16a34a; --primary-dark:#15803d; --primary-soft:#dcfce7;
  --accent:#f59e0b;
  --bg:#faf9f7; --text:#0f172a; --text-soft:#334155;
  --muted:#64748b; --border:#e8e6e3; --radius:18px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
  --shadow-md:0 4px 12px -2px rgba(15,23,42,.08), 0 12px 32px -8px rgba(15,23,42,.10);
  --shadow-lg:0 20px 60px -12px rgba(15,23,42,.20);
}
*{box-sizing:border-box}
html, body{margin:0; overflow-x:hidden}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  line-height:1.5; touch-action:pan-y;
}
button{font-family:inherit}

.hero{
  background:
    radial-gradient(1200px 400px at 0% -20%, #bbf7d0 0%, transparent 60%),
    radial-gradient(800px 300px at 100% 0%, #fef3c7 0%, transparent 55%),
    linear-gradient(135deg, #ffffff 0%, #f3fbf5 100%);
  border-bottom:1px solid var(--border);
  padding:36px 20px 28px;
}
.hero-inner{max-width:860px;margin:0 auto}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:#fff; border:1px solid var(--border);
  padding:6px 12px; border-radius:99px;
  font-size:12.5px; color:var(--text-soft); font-weight:500;
  box-shadow:var(--shadow-sm); margin-bottom:16px;
}
.hero-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.hero h1{font-size:clamp(24px,4vw,34px);margin:0 0 8px;letter-spacing:-0.02em;line-height:1.15;font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--primary),#10b981);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:15px;max-width:560px}

.app{max-width:860px;margin:0 auto;padding:0 20px 140px}
.progress-wrap{padding:20px 0 4px}
.steps{display:flex;align-items:center;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.step-dot{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:99px;font-size:13px;color:var(--muted);font-weight:500;background:transparent;border:1px solid transparent;transition:.2s}
.step-dot.active{background:#fff;border-color:var(--border);color:var(--text);box-shadow:var(--shadow-sm)}
.step-dot.done{color:var(--primary-dark)}
.step-num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#e7e5e4;color:var(--muted);flex:0 0 auto;transition:.2s}
.step-dot.active .step-num{background:var(--primary);color:#fff}
.step-dot.done .step-num{background:var(--primary-soft);color:var(--primary-dark)}

h2{font-size:22px;margin:0 0 6px;letter-spacing:-0.015em;font-weight:700}
h3{font-size:16px;margin:28px 0 12px;letter-spacing:-0.01em}
.hint{color:var(--muted);font-size:14.5px;margin:0 0 20px;line-height:1.55}
.field-label{font-size:12.5px;color:var(--muted);margin:18px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* ─── STORES ─── */
.stores-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.store-card{
  display:flex;align-items:center;gap:12px;
  padding:14px;background:#fff;border:2px solid var(--border);
  border-radius:16px;cursor:pointer;text-align:left;
  font:inherit;color:inherit;transition:all .18s;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.store-card:hover{border-color:#d4d2ce;transform:translateY(-1px);box-shadow:var(--shadow-md)}
.store-card.active{border-color:var(--primary);background:linear-gradient(135deg,#f0fdf4,#fff)}
.store-logo{
  width:48px;height:48px;border-radius:12px;
  display:grid;place-items:center;font-size:22px;flex:0 0 auto;
  color:#fff;font-weight:700;
  box-shadow:0 4px 12px -2px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.25);
  text-shadow:0 1px 2px rgba(0,0,0,.15);
}
.store-info{flex:1;min-width:0}
.store-name{font-weight:700;font-size:15px;margin-bottom:3px;letter-spacing:-0.01em}
.store-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.store-type{padding:1px 7px;background:#f1f5f9;border-radius:5px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--text-soft)}
.store-price{font-weight:700;color:var(--primary-dark);font-size:12px;letter-spacing:.05em}
.store-check{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--border);flex:0 0 auto;
  display:grid;place-items:center;font-size:12px;color:#fff;line-height:1;transition:.18s;
}
.store-card.active .store-check{background:var(--primary);border-color:var(--primary)}

/* ─── CHIPS ─── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 16px;border-radius:99px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font:inherit;font-size:14px;transition:all .15s;color:var(--text-soft);font-weight:500}
.chip:hover{border-color:#d4d2ce;color:var(--text)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px -2px rgba(22,163,74,.35)}
.link{display:inline-block;margin-top:12px;background:none;border:none;padding:0;color:var(--primary);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:none;border-bottom:1px dashed currentColor}

/* ─── BUDGET ─── */
.budget-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow-md)}
.budget-value{font-size:44px;font-weight:800;line-height:1;margin-bottom:20px;letter-spacing:-0.03em;background:linear-gradient(135deg,var(--primary),#059669);-webkit-background-clip:text;background-clip:text;color:transparent}
.budget-value small{font-size:18px;font-weight:600;color:var(--muted);-webkit-text-fill-color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--primary);height:28px;cursor:pointer;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:#e7e5e4;border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--primary);box-shadow:0 2px 8px rgba(22,163,74,.30);margin-top:-8px;cursor:grab}
input[type=range]::-moz-range-track{height:6px;background:#e7e5e4;border-radius:99px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--primary);cursor:grab}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ─── TABS ─── */
.tabs{display:flex;gap:4px;padding:4px;background:#f1f5f9;border-radius:12px;margin-bottom:16px}
.tab{flex:1;padding:10px;border:none;background:transparent;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:9px;transition:.15s}
.tab.active{background:#fff;color:var(--text);box-shadow:var(--shadow-sm)}

/* ─── SEL SUMMARY ─── */
.sel-summary{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:14px 16px;
  background:linear-gradient(135deg,#f0fdf4,#f8fafc);
  border:1px solid var(--primary-soft);border-radius:14px;
  margin-bottom:16px;font-size:14px;flex-wrap:wrap;
}
.sel-summary-count b{color:var(--primary-dark)}
.sel-summary-cost{font-size:13px;color:var(--muted)}
.sel-summary-cost b{color:var(--primary-dark);font-size:17px;font-weight:800;letter-spacing:-0.02em}

/* ─── PICK DISH ─── */
.pick-dish{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;background:#fff;
  border:2px solid var(--border);border-radius:14px;
  cursor:pointer;transition:all .15s;margin-bottom:8px;
  box-shadow:var(--shadow-sm);
}
.pick-dish:hover{border-color:#d4d2ce;transform:translateY(-1px)}
.pick-dish.active{border-color:var(--primary);background:linear-gradient(135deg,#f0fdf4,#fff)}
.pick-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);flex:0 0 auto;display:grid;place-items:center;font-size:13px;color:#fff;background:#fff;transition:.15s}
.pick-dish.active .pick-check{background:var(--primary);border-color:var(--primary)}
.pick-emoji{font-size:22px;line-height:1;flex:0 0 auto}
.pick-info{flex:1;min-width:0}
.pick-name{font-weight:600;font-size:14.5px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-meta{font-size:12px;color:var(--muted)}
.pick-price{font-weight:700;color:var(--primary-dark);font-size:13px;white-space:nowrap;flex:0 0 auto}
.pick-recipe{
  background:transparent;border:none;padding:4px;cursor:pointer;
  font-size:16px;opacity:.45;transition:.15s;border-radius:8px;line-height:1;flex:0 0 auto;
}
.pick-recipe:hover{opacity:1;background:#f1f5f9}

/* ─── PRESET ─── */
.preset-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);transition:.15s}
.preset-card:hover{box-shadow:var(--shadow-md)}
.preset-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.preset-title{font-weight:700;font-size:15px}
.preset-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.btn-apply{padding:8px 16px;background:var(--primary);color:#fff;border:none;border-radius:9px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;box-shadow:0 2px 6px -1px rgba(22,163,74,.4)}
.btn-apply:hover{background:var(--primary-dark);transform:translateY(-1px)}
.preset-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--border);color:var(--text-soft)}
.preset-item:last-child{border-bottom:none}
.menu-day{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px;font-weight:700}
.type-tag{font-size:10.5px;font-weight:600;color:var(--muted);background:#f1f5f9;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;flex:0 0 auto}

.cat-header{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text-soft);margin:24px 0 10px;text-transform:uppercase;letter-spacing:.05em}
.cat-header .count{background:#f1f5f9;color:var(--muted);padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}

.empty{text-align:center;padding:44px 24px;color:var(--muted);background:#fff;border-radius:var(--radius);border:1.5px dashed var(--border);font-size:14px;line-height:1.6}
.empty .emoji{font-size:36px;display:block;margin-bottom:10px}

/* ─── FOOTER ─── */
.footer{
  position:fixed;left:0;right:0;bottom:0;
  background:rgba(255,255,255,.93);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));z-index:50;
}
@media(max-width:640px){.footer{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}}
.footer-inner{max-width:860px;margin:0 auto;display:flex;gap:10px}
.btn-primary{
  flex:1;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;
  transition:.18s;box-shadow:0 4px 14px -4px rgba(22,163,74,.45);letter-spacing:-0.01em;
}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px -4px rgba(22,163,74,.55)}
.btn-primary:disabled{background:#cbd5e1;box-shadow:none;cursor:not-allowed;transform:none}
.btn-ghost{padding:14px 20px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;color:var(--text-soft);transition:.15s}
.btn-ghost:hover:not(:disabled){border-color:#d4d2ce}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed}

/* ─── MODAL ─── */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;
  background:rgba(15,23,42,.45);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
  height:100vh;height:100dvh;
}
.modal-backdrop.show{opacity:1;pointer-events:auto}
@media(min-width:640px){.modal-backdrop{align-items:center;padding:24px}}
.modal{
  background:#fff;width:100%;max-width:640px;
  max-height:90vh;max-height:90dvh;
  border-radius:24px 24px 0 0;overflow:hidden;
  display:flex;flex-direction:column;
  transform:translateY(24px) scale(.98);opacity:0;
  transition:transform .28s cubic-bezier(.34,1.3,.64,1),opacity .22s;
  box-shadow:var(--shadow-lg);position:relative;
}
@media(min-width:640px){.modal{border-radius:24px}}
.modal-backdrop.show .modal{transform:translateY(0) scale(1);opacity:1}
.modal-close{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;color:var(--text-soft);box-shadow:var(--shadow-sm);transition:.15s}
.modal-close:hover{background:#fff;transform:scale(1.05)}
.modal-hero{
  background:
    radial-gradient(600px 200px at 30% 0%, #dcfce7 0%, transparent 70%),
    radial-gradient(400px 200px at 80% 40%, #fef3c7 0%, transparent 70%),
    linear-gradient(135deg,#f9fafb,#f3fbf5);
  padding:28px 24px 22px;display:flex;align-items:center;gap:16px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-hero-emoji{width:70px;height:70px;flex:0 0 auto;border-radius:20px;display:grid;place-items:center;font-size:40px;background:#fff;box-shadow:var(--shadow-md)}
.modal-hero-text{flex:1;min-width:0}
.modal-hero-text h3{margin:0 0 6px;font-size:20px;letter-spacing:-0.02em;color:var(--text);font-weight:800;line-height:1.2}
.modal-hero-tags{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.modal-hero-tags span{background:rgba(255,255,255,.85);padding:3px 8px;border-radius:6px;font-weight:500;border:1px solid rgba(0,0,0,.04)}
.modal-body{padding:20px 24px 28px;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.modal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.modal-stat{text-align:center;background:#f8fafc;border-radius:12px;padding:10px 6px;border:1px solid var(--border)}
.modal-stat-val{font-weight:700;font-size:15px;color:var(--text);letter-spacing:-0.01em}
.modal-stat-lbl{font-size:10.5px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.modal-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
.modal-ing{list-style:none;padding:0;margin:0 0 24px;background:#fafaf9;border-radius:14px;border:1px solid var(--border);overflow:hidden}
.modal-ing li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;font-size:14px;border-bottom:1px dashed var(--border)}
.modal-ing li:last-child{border-bottom:none}
.modal-ing .ing-name{color:var(--text-soft);font-weight:500}
.modal-ing .ing-detail{color:var(--muted);font-size:11.5px;margin-top:2px}
.modal-ing .ing-right{text-align:right;flex-shrink:0}
.modal-ing .ing-amt{color:var(--text);font-weight:600;font-size:13.5px}
.modal-ing .ing-pkg{color:var(--muted);font-size:11px;margin-top:2px}
.modal-steps{list-style:none;counter-reset:step;padding:0;margin:0}
.modal-steps li{counter-increment:step;position:relative;padding:0 0 16px 40px;font-size:14.5px;line-height:1.6;color:var(--text-soft)}
.modal-steps li::before{content:counter(step);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);display:grid;place-items:center;font-size:12.5px;font-weight:700}
.modal-steps li:not(:last-child)::after{content:'';position:absolute;left:13px;top:30px;bottom:0;width:1px;background:var(--border)}
.shopping-total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:12px 16px;background:var(--primary-soft);border-radius:12px;font-weight:700;font-size:15px;color:var(--primary-dark)}
.store-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.store-pill{padding:6px 12px;border-radius:99px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font:inherit;font-size:12.5px;font-weight:500;color:var(--text-soft);transition:.15s}
.store-pill.active{background:var(--primary);border-color:var(--primary);color:#fff}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-badge">Рецепты · покупки · конструктор меню</div>
    <h1>Собери меню <em>под себя</em></h1>
    <p>Выберите магазины и фильтры, а потом сами наберите блюда в меню. Список покупок — по упаковкам, как в реальном магазине.</p>
  </div>
</header>

<div class="app">
  <div class="progress-wrap"><div class="steps" id="steps"></div></div>
  <main id="main"></main>
</div>

<div class="footer">
  <div class="footer-inner">
    <button class="btn-ghost" id="back">Назад</button>
    <button class="btn-primary" id="next">Далее</button>
  </div>
</div>

<div class="modal-backdrop" id="modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
    <div id="modalContent" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0;"></div>
  </div>
</div>

<script>
/* ═════════════ ПРОДУКТЫ ═════════════ */
const PRODUCTS = {
  chicken_breast:{name:'Куриная грудка',    unit:'kg', packSize:1,    packPrice:400,  packLabel:'1 кг',    allergens:[]},
  chicken_thigh: {name:'Куриное бедро',     unit:'kg', packSize:1,    packPrice:290,  packLabel:'1 кг',    allergens:[]},
  beef:          {name:'Говядина (лопатка)',unit:'kg', packSize:1,    packPrice:650,  packLabel:'1 кг',    allergens:[]},
  pork:          {name:'Свинина (шея)',     unit:'kg', packSize:1,    packPrice:500,  packLabel:'1 кг',    allergens:[]},
  turkey:        {name:'Индейка (филе)',    unit:'kg', packSize:1,    packPrice:550,  packLabel:'1 кг',    allergens:[]},
  minced_beef:   {name:'Фарш говяжий',      unit:'kg', packSize:1,    packPrice:480,  packLabel:'1 кг',    allergens:[]},
  bacon:         {name:'Бекон',             unit:'kg', packSize:0.2,  packPrice:110,  packLabel:'200 г',   allergens:[]},
  salmon:  {name:'Лосось',   unit:'kg', packSize:1,   packPrice:1300, packLabel:'1 кг',   allergens:['fish']},
  cod:     {name:'Треска',   unit:'kg', packSize:1,   packPrice:550,  packLabel:'1 кг',   allergens:['fish']},
  shrimp:  {name:'Креветки', unit:'kg', packSize:0.5, packPrice:500,  packLabel:'500 г',  allergens:['seafood']},
  egg:           {name:'Яйца С1',         unit:'piece', packSize:10,   packPrice:119,  packLabel:'десяток', allergens:['eggs']},
  milk:          {name:'Молоко 2.5%',     unit:'L', packSize:1,    packPrice:90,   packLabel:'1 л',     allergens:['milk']},
  kefir:         {name:'Кефир',           unit:'L', packSize:1,    packPrice:100,  packLabel:'1 л',     allergens:['milk']},
  cheese:        {name:'Сыр',             unit:'kg',packSize:0.2,  packPrice:160,  packLabel:'200 г',   allergens:['milk']},
  mozzarella:    {name:'Моцарелла',       unit:'kg',packSize:0.2,  packPrice:170,  packLabel:'200 г',   allergens:['milk']},
  cottage:       {name:'Творог 5%',       unit:'kg',packSize:0.2,  packPrice:80,   packLabel:'200 г',   allergens:['milk']},

  budget:5000, days:3,
  selected: new Set(),
  tab:'manual',
  catFilter:'all',
  samples:[], sampleKey:'',

const money = n => new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽';
const toggle = (arr,v) => { const i=arr.indexOf(v); i===-1?arr.push(v):arr.splice(i,1); };
const nameOf = (list,id) => (list.find(x=>x.id===id)||{}).name || id;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

function pluralDays(n) {
  if (n === 1) return 'день';
  if (n < 5) return 'дня';
  return 'дней';
}
function pluralDishes(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return 'блюдо';
  if (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) return 'блюда';
  return 'блюд';
}

function packsNeeded(prod, qty) {
  return Math.ceil(qty / (prod.unit === 'piece' ? prod.packSize : prod.packSize * 1000));
}

function priceLevelLabel(lvl) {
  return ['₽','₽₽','₽₽₽'][lvl-1] || '₽';
}

/* ═════════════ СТОИМОСТЬ ВЫБОРА ═════════════ */
function computeSelection(dishes) {
  if (!dishes.length || !state.stores.length)
    return {total:0, items:[], storeId:null};

  const agg = {};
  for (const d of dishes) for (const ing of d.ing)
    agg[ing.p] = (agg[ing.p] || 0) + ing.g;

  const perStore = state.stores.map(sid => {
    const mult = (STORES.find(s => s.id === sid) || {mult:1}).mult;
    let total = 0;
    const items = [];
    for (const [pid, qty] of Object.entries(agg)) {
      const p = PRODUCTS[pid];
      const packs = packsNeeded(p, qty);
      const cost = packs * p.packPrice * mult;
      total += cost;
      items.push({pid, p, qty, packs, cost});
    }
    items.sort((a,b) => b.cost - a.cost);
    return {storeId: sid, total, items};
  }).sort((a,b) => a.total - b.total);

  return perStore[0] || {total:0, items:[], storeId:null};
}

/* Стоимость блюда отдельно (для отображения ~X ₽) */
function singleDishCost(dish) {
  return computeSelection([dish]).total;
}

/* ═════════════ ФИЛЬТРАЦИЯ ═════════════ */
function filterRecipes() {
  return RECIPES
    .filter(r => !r.allergens.some(a => state.allergies.includes(a)))
    .filter(r => !r.tags.some(t => state.exclude.includes(t)));
}

/* ═════════════ СБОРКА ПРЕСЕТОВ ═════════════ */
function buildSamples(valid, days, budget, count=4) {
  const byCat = {
    breakfast: valid.filter(r=>r.cat==='breakfast'),
    soup:      valid.filter(r=>r.cat==='soup'),
    main:      valid.filter(r=>r.cat==='main'),
    salad:     valid.filter(r=>r.cat==='salad'),
  };
  if (Object.values(byCat).some(a => !a.length)) return [];

  const results = [];
  const seen = new Set();
  for (let i = 0; i < 3000 && results.length < count; i++) {
    const plan = [];
    for (let d = 0; d < days; d++) {
      plan.push([
        {type:'Завтрак', dish: pick(byCat.breakfast)},
        {type:'Суп',     dish: pick(byCat.soup)},
        {type:'Горячее', dish: pick(byCat.main)},
        {type:'Салат',   dish: pick(byCat.salad)},
      ]);
    }
    const key = plan.flatMap(d => d.map(x => x.dish.id)).sort().join('|');
    if (seen.has(key)) continue;
    seen.add(key);

    const allDishes = plan.flatMap(d => d.map(x => x.dish));
    const uniqueDishes = [...new Map(allDishes.map(d => [d.id, d])).values()];
    const cost = computeSelection(uniqueDishes);
    if (cost.total > budget || cost.total < budget * 0.30) continue;
    results.push({plan, total: cost.total, storeId: cost.storeId, uniqueDishes});
  }
  return results;
}

/* ─── КОНСТРУКТОР ─── */
function renderBuilder() {
  const valid = filterRecipes();

  // очищаем невалидные блюда из выбора
  const validIds = new Set(valid.map(r => r.id));
  for (const id of [...state.selected]) if (!validIds.has(id)) state.selected.delete(id);

  const selectedDishes = RECIPES.filter(r => state.selected.has(r.id));
  const total = computeSelection(selectedDishes).total;

  const tabsHtml = `
    <div class="tabs">
      <button class="tab ${state.tab==='manual'?'active':''}" data-act="tab" data-val="manual">Соберите сами</button>
      <button class="tab ${state.tab==='presets'?'active':''}" data-act="tab" data-val="presets">Готовые варианты</button>
    </div>
  `;

  const summaryHtml = `
    <div class="sel-summary">
      <div class="sel-summary-count">Выбрано: <b>${selectedDishes.length}</b> ${pluralDishes(selectedDishes.length)}</div>
      <div class="sel-summary-cost">${selectedDishes.length
        ? 'продукты на <b>'+money(total)+'</b>'
        : 'нажмите на блюдо ниже'}</div>
    </div>
  `;

  if (state.tab === 'manual') {
    const cats = [
      {id:'all',name:'Все'},{id:'breakfast',name:'Завтраки'},
      {id:'soup',name:'Супы'},{id:'main',name:'Горячее'},{id:'salad',name:'Салаты'},
    ];
    const list = valid.filter(r => state.catFilter==='all' || r.cat===state.catFilter);
    const filterHtml = `
      <div class="chips" style="margin-bottom:12px">
        ${cats.map(c => `<button class="chip ${state.catFilter===c.id?'active':''}" data-act="catFilter" data-val="${c.id}">${c.name}</button>`).join('')}
      </div>
    `;
    const listHtml = list.length ? list.map(r => {
      const on = state.selected.has(r.id);
      const cost = singleDishCost(r);
      return `
        <div class="pick-dish ${on?'active':''}" data-act="pickDish" data-val="${r.id}">
          <div class="pick-check">${on?'✓':''}</div>
          <div class="pick-emoji">${r.emoji}</div>
          <div class="pick-info">
            <div class="pick-name">${r.name}</div>
            <div class="pick-meta">⏱ ${r.time} мин · 🍽 ${r.servings} порц.</div>
          </div>
          <div class="pick-price">~${Math.round(cost)} ₽</div>
          <button class="pick-recipe" data-act="openRecipe" data-val="${r.id}" title="Открыть рецепт">📖</button>
        </div>
      `;
    }).join('') : `<div class="empty">В этой категории нет блюд с текущими фильтрами.</div>`;

    return `${tabsHtml}${summaryHtml}${filterHtml}${listHtml}`;
  }

  // presets
  const key = [state.stores.join(','), state.allergies.join(','), state.exclude.join(','), state.budget, state.days].join('#');
  if (key !== state.sampleKey) {
    state.samples = buildSamples(valid, state.days, state.budget, 4);
    state.sampleKey = key;
  }

  if (!state.samples.length) {
    return `${tabsHtml}${summaryHtml}<div class="empty"><span class="emoji">💸</span>Не удалось собрать готовые варианты в этом бюджете. Увеличьте бюджет или сократите план.</div>`;
  }

  const presetsHtml = state.samples.map((s, idx) => `
    <div class="preset-card">
      <div class="preset-head">
        <div>
          <div class="preset-title">Вариант ${idx+1}</div>
          <div class="preset-sub">${state.days} ${pluralDays(state.days)} · ${money(s.total)}</div>
        </div>
        <button class="btn-apply" data-act="applyPreset" data-val="${idx}">Применить</button>
      </div>
      ${s.plan.map((day, i) => `
        ${state.days > 1 ? `<div class="menu-day">День ${i+1}</div>` : ''}
        ${day.map(x => `
          <div class="preset-item">
            <span class="type-tag">${x.type}</span>
            <span>${x.dish.emoji} ${x.dish.name}</span>
          </div>
        `).join('')}
      `).join('')}
    </div>
  `).join('');

  return `${tabsHtml}${summaryHtml}${presetsHtml}`;
}

/* ═════════════ МОДАЛКИ ═════════════ */
const modal = document.getElementById('modal');
const modalContent = document.getElementById('modalContent');
const modalClose = document.getElementById('modalClose');

function lockScroll(lock) {
  if (lock) {
    document.body.style.overflow = 'hidden';
    document.body.style.position = 'fixed';
    document.body.style.width = '100%';
  } else {
    document.body.style.overflow = '';
    document.body.style.position = '';
    document.body.style.width = '';
  }
}
function openModal(html) {
  modalContent.innerHTML = html;
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
  lockScroll(true);
}
function closeModal() {
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
  lockScroll(false);
  setTimeout(() => { if (!modal.classList.contains('show')) modalContent.innerHTML = ''; }, 300);
}
modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('show')) closeModal(); });

function openRecipe(id) {
  const dish = RECIPES.find(r => r.id === id);
  if (!dish) return;
  const cost = singleDishCost(dish);
  const mult = (STORES.find(s => s.id === state.stores[0]) || {mult:1}).mult;

  const html = `
    <div class="modal-hero">
      <div class="modal-hero-emoji">${dish.emoji}</div>
      <div class="modal-hero-text">
        <h3>${dish.name}</h3>
        <div class="modal-hero-tags">
          <span>~${Math.round(cost)} ₽ за продукты</span>
          <span>${dish.difficulty}</span>
        </div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-stats">
        <div class="modal-stat"><div class="modal-stat-val">${dish.time}</div><div class="modal-stat-lbl">мин</div></div>
        <div class="modal-stat"><div class="modal-stat-val">${dish.servings}</div><div class="modal-stat-lbl">порции</div></div>
        <div class="modal-stat"><div class="modal-stat-val">${dish.kcal}</div><div class="modal-stat-lbl">ккал</div></div>
        <div class="modal-stat"><div class="modal-stat-val">${dish.ing.length}</div><div class="modal-stat-lbl">ингр.</div></div>
      </div>
      <p class="modal-section-title">Что купить (упаковки)</p>
      <ul class="modal-ing">
        ${dish.ing.map(ing => {
          const p = PRODUCTS[ing.p];
          const packs = packsNeeded(p, ing.g);
          const costOne = packs * p.packPrice * mult;
          const needLabel = p.unit === 'piece'
            ? `${ing.g} шт`
            : (ing.g >= 1000 ? (ing.g/1000).toFixed(2).replace(/\.?0+$/,'') + ' кг' : ing.g + ' г');
          return `<li>
            <div>
              <div class="ing-name">${p.name}</div>

            </div>
            <div class="ing-right">
              <div class="ing-amt">${money(costOne)}</div>

            </div>
          </li>`;
        }).join('')}

      <ol class="modal-steps">
        ${dish.steps.map(s => `<li>${s}</li>`).join('')}
      </ol>
    </div>
  `;
  openModal(html);
}

function openShoppingForDishes(dishes) {
  if (!dishes.length) return;
  const storeIds = state.stores.length ? state.stores : [STORES[0].id];
  let currentStore = storeIds[0];

  const render = () => {
    const data = computeSelectionForStore(dishes, currentStore);
    const itemsHtml = data.items.map(it => {
      const needLabel = it.p.unit === 'piece'
        ? `нужно ${it.qty} шт`
        : (it.qty >= 1000 ? 'нужно ' + (it.qty/1000).toFixed(2).replace(/\.?0+$/,'') + ' кг' : 'нужно ' + it.qty + ' г');
      return `<li>
        <div>
          <div class="ing-name">${it.p.name}</div>
          <div class="ing-detail">${needLabel}</div>
        </div>
        <div class="ing-right">
          <div class="ing-amt">${money(it.cost)}</div>
          <div class="ing-pkg">${it.packs} × ${it.p.packLabel}</div>
        </div>
      </li>`;
    }).join('');

    document.getElementById('shopping-inner').innerHTML = `
      ${storeIds.length > 1 ? `
        <div class="store-pills">
          ${storeIds.map(sid => `<button class="store-pill ${sid===currentStore?'active':''}" data-act="pickStore" data-val="${sid}">${nameOf(STORES,sid)}</button>`).join('')}
        </div>
      ` : ''}
      <ul class="modal-ing">${itemsHtml}</ul>
      <div class="shopping-total"><span>Итого в кассе</span><span>${money(data.total)}</span></div>
    `;
  };

  const html = `
    <div class="modal-hero">
      <div class="modal-hero-emoji">🧾</div>
      <div class="modal-hero-text">
        <h3>Список покупок</h3>
        <div class="modal-hero-tags">
          <span>${dishes.length} ${pluralDishes(dishes.length)}</span>
          <span>все продукты</span>
        </div>
      </div>
    </div>
    <div class="modal-body"><div id="shopping-inner"></div></div>
  `;
  openModal(html);
  render();

  modalContent.querySelector('.modal-body').addEventListener('click', e => {
    const btn = e.target.closest('[data-act="pickStore"]');
    if (!btn) return;
    currentStore = btn.dataset.val;
    render();
  });
}

function computeSelectionForStore(dishes, storeId) {
  const mult = (STORES.find(s => s.id === storeId) || {mult:1}).mult;
  const agg = {};
  for (const d of dishes) for (const ing of d.ing)
    agg[ing.p] = (agg[ing.p] || 0) + ing.g;
  let total = 0;
  const items = [];
  for (const [pid, qty] of Object.entries(agg)) {
    const p = PRODUCTS[pid];
    const packs = packsNeeded(p, qty);
    const cost = packs * p.packPrice * mult;
    total += cost;
    items.push({pid, p, qty, packs, cost});
  }
  items.sort((a,b) => b.cost - a.cost);
  return {total, items, mult};
}

/* ═════════════ НАВИГАЦИЯ ═════════════ */
const main = document.getElementById('main');
const backBtn = document.getElementById('back');
const nextBtn = document.getElementById('next');
const canGoNext = () => state.step === 0 ? state.stores.length > 0 : true;

function render() {
  renderStepIndicator();

  if (state.step === 4) {
    main.innerHTML = renderBuilder();
    const selectedDishes = RECIPES.filter(r => state.selected.has(r.id));
    const total = computeSelection(selectedDishes).total;

    backBtn.textContent = 'Изменить условия';
    backBtn.disabled = false;
    nextBtn.textContent = selectedDishes.length ? `Список покупок · ${money(total)}` : 'Список покупок';
    nextBtn.disabled = !selectedDishes.length;
  } else {
    main.innerHTML = STEPS_RENDER[state.step]();
    backBtn.textContent = 'Назад';
    backBtn.disabled = state.step === 0;
    nextBtn.textContent = state.step === 3 ? 'Собрать меню' : 'Далее';
    nextBtn.disabled = !canGoNext();
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

nextBtn.addEventListener('click', () => {
  if (state.step === 4) {
    const dishes = RECIPES.filter(r => state.selected.has(r.id));
    openShoppingForDishes(dishes);
    return;
  }
  if (state.step === 3) { state.step = 4; render(); return; }
  state.step++; render();
});
backBtn.addEventListener('click', () => {
  if (state.step === 4) { state.step = 3; render(); return; }
  if (state.step > 0) { state.step--; render(); }
});

main.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, val } = el.dataset;

  if (act === 'openRecipe') { openRecipe(val); return; }

  if (act === 'store')     { toggle(state.stores, val); render(); }
  if (act === 'allergy')   { toggle(state.allergies, val); render(); }
  if (act === 'exclude')   { toggle(state.exclude, val); render(); }
  if (act === 'budget')    { state.budget = +val; render(); }
  if (act === 'days')      { state.days = +val; render(); }
  if (act === 'allstores') { state.stores = state.stores.length === STORES.length ? [] : STORES.map(s => s.id); render(); }
  if (act === 'tab')       { state.tab = val; render(); }
  if (act === 'catFilter') { state.catFilter = val; render(); }
  if (act === 'pickDish') {
    if (state.selected.has(val)) state.selected.delete(val);
    else state.selected.add(val);
    render();
  }
  if (act === 'applyPreset') {
    const s = state.samples[+val];
    if (!s) return;
    for (const d of s.uniqueDishes) state.selected.add(d.id);
    state.tab = 'manual';
    render();
  }
});

main.addEventListener('input', e => {
  if (e.target.id !== 'budgetRange') return;
  state.budget = +e.target.value;
  document.getElementById('budgetValue').innerHTML = state.budget + ' <small>₽</small>';
  main.querySelectorAll('[data-act="budget"]').forEach(b => {
    b.classList.toggle('active', +b.dataset.val === state.budget);
  });
});

render();
</script>
