<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Подбор меню</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --accent:#16a34a; --accent-soft:#e7f8ec;
    --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --radius:16px;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px -12px rgba(15,23,42,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  }
  .app{max-width:760px;margin:0 auto;padding:20px 16px 120px}
  header h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .progress{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:22px}
  .progress > i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s ease}

  h2{font-size:19px;margin:0 0 4px}
  h3{font-size:16px;margin:26px 0 10px}
  .hint{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.45}

  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .option{
    display:flex;align-items:center;gap:10px;padding:14px;border:1.5px solid var(--border);
    background:var(--card);border-radius:var(--radius);cursor:pointer;transition:.15s;
    font:inherit;color:inherit;text-align:left;box-shadow:var(--shadow);
  }
  .option:hover{border-color:#cbd5e1;transform:translateY(-1px)}
  .option.active{border-color:var(--accent);background:var(--accent-soft)}
  .option .emoji{font-size:20px}
  .option .check{
    margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);
    flex:0 0 auto;display:grid;place-items:center;font-size:12px;color:#fff;line-height:1;
  }
  .option.active .check{background:var(--accent);border-color:var(--accent)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    padding:9px 16px;border-radius:99px;border:1.5px solid var(--border);background:var(--card);
    cursor:pointer;font:inherit;font-size:14px;transition:.15s;
  }
  .chip:hover{border-color:#cbd5e1}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

  .link{
    display:inline-block;margin-top:12px;background:none;border:none;padding:0;
    color:var(--accent);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;
  }

  /* бюджет */
  .budget-box{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
  .budget-value{font-size:38px;font-weight:700;line-height:1;margin-bottom:18px}
  .budget-value small{font-size:16px;color:var(--muted);font-weight:500}
  input[type=range]{width:100%;accent-color:var(--accent);height:28px;cursor:pointer}
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

  /* результаты */
  .summary{background:var(--accent-soft);border-radius:var(--radius);padding:14px 16px;font-size:14px;line-height:1.6}
  .summary b{font-weight:600}
  .dish{
    display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);
    border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);
  }
  .dish-emoji{font-size:26px;flex:0 0 auto}
  .dish-body{flex:1;min-width:0}
  .dish-name{font-weight:600;font-size:15px;margin-bottom:3px}
  .dish-meta{color:var(--muted);font-size:12.5px;line-height:1.4}
  .dish-price{font-weight:700;font-size:16px;white-space:nowrap}
  .total{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card);border:1.5px dashed var(--accent);border-radius:var(--radius);font-weight:600;margin-top:10px}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);background:var(--card);border-radius:var(--radius);border:1.5px dashed var(--border)}

  /* футер */
  .footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:12px 16px}
  .footer-inner{max-width:760px;margin:0 auto;display:flex;gap:10px}
  .btn-primary{flex:1;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.15s}
  .btn-primary:hover:not(:disabled){background:#15803d}
  .btn-primary:disabled{background:#cbd5e1;cursor:not-allowed}
  .btn-ghost{padding:14px 20px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font:inherit;font-size:16px;font-weight:500;cursor:pointer}
  .btn-ghost:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>🥗 Подбор меню</h1>
    <p class="sub">Магазины → аллергии → исключения → бюджет</p>
    <div class="progress"><i id="bar"></i></div>
  </header>
  <main id="main"></main>
</div>

<div class="footer">
  <div class="footer-inner">
    <button class="btn-ghost" id="back">Назад</button>
    <button class="btn-primary" id="next">Далее</button>
  </div>
</div>

<script>
/* ─────────────────────────  ДАННЫЕ  ───────────────────────── */

const STORES = [
  { id:'auchan',      name:'Ашан',        emoji:'🛒' },
  { id:'pyaterochka', name:'Пятёрочка',   emoji:'🟢' },
  { id:'perekrestok', name:'Перекрёсток', emoji:'🔵' },
  { id:'magnit',      name:'Магнит',      emoji:'🔴' },
  { id:'vkusvill',    name:'ВкусВилл',    emoji:'🥬' },
  { id:'lenta',       name:'Лента',       emoji:'🔷' },
];

const ALLERGENS = [
  { id:'nuts',    name:'Орехи' },
  { id:'milk',    name:'Молоко' },
  { id:'gluten',  name:'Глютен' },
  { id:'eggs',    name:'Яйца' },
  { id:'soy',     name:'Соя' },
  { id:'fish',    name:'Рыба' },
  { id:'seafood', name:'Морепродукты' },
];

const EXCLUDES = [
  { id:'fish',      name:'Рыба' },
  { id:'seafood',   name:'Морепродукты' },
  { id:'pork',      name:'Свинина' },
  { id:'beef',      name:'Говядина' },
  { id:'chicken',   name:'Курица' },
  { id:'meat',      name:'Любое мясо' },
  { id:'spicy',     name:'Острое' },
  { id:'mushrooms', name:'Грибы' },
  { id:'offal',     name:'Субпродукты' },
];

// tags — вкусовые/составные признаки (для исключений)
// allergens — реальные аллергены (для аллергий)
const DISHES = [
  { id:1,  name:'Оливье с курицей',      price:180, emoji:'🥗', stores:['auchan','pyaterochka','magnit','perekrestok'], tags:['chicken','meat'], allergens:['eggs','milk'] },
  { id:2,  name:'Салат Цезарь',          price:260, emoji:'🥬', stores:['perekrestok','vkusvill','auchan'],             tags:['chicken','meat'], allergens:['gluten','milk','eggs'] },
  { id:3,  name:'Борщ с говядиной',      price:220, emoji:'🍲', stores:['auchan','magnit','pyaterochka','lenta'],       tags:['beef','meat'],    allergens:[] },
  { id:4,  name:'Уха из лосося',         price:320, emoji:'🐟', stores:['perekrestok','lenta','vkusvill'],               tags:['fish'],           allergens:['fish'] },
  { id:5,  name:'Паста карбонара',       price:290, emoji:'🍝', stores:['perekrestok','vkusvill'],                       tags:['pork','meat'],    allergens:['gluten','milk','eggs'] },
  { id:6,  name:'Плов с говядиной',      price:250, emoji:'🍚', stores:['auchan','magnit','lenta'],                      tags:['beef','meat'],    allergens:[] },
  { id:7,  name:'Куриный суп с лапшой',  price:190, emoji:'🍜', stores:['pyaterochka','magnit','auchan'],                tags:['chicken','meat'], allergens:['gluten','eggs'] },
  { id:8,  name:'Греческий салат',       price:210, emoji:'🫒', stores:['vkusvill','perekrestok','auchan'],              tags:['veg'],            allergens:['milk'] },
  { id:9,  name:'Овощной суп-пюре',      price:160, emoji:'🥣', stores:['pyaterochka','magnit','auchan','lenta'],        tags:['veg'],            allergens:[] },
  { id:10, name:'Стейк из свинины',      price:380, emoji:'🥩', stores:['auchan','lenta'],                               tags:['pork','meat'],    allergens:[] },
  { id:11, name:'Креветки в соусе',      price:420, emoji:'🍤', stores:['vkusvill','perekrestok','lenta'],               tags:['seafood'],        allergens:['seafood'] },
  { id:12, name:'Том Ям',                price:390, emoji:'🌶️', stores:['vkusvill','perekrestok'],                       tags:['seafood','spicy'],allergens:['seafood','fish'] },
  { id:13, name:'Курица карри',          price:280, emoji:'🍛', stores:['pyaterochka','magnit','auchan'],                tags:['chicken','meat','spicy'], allergens:['milk'] },
  { id:14, name:'Гречка с грибами',      price:170, emoji:'🍄', stores:['pyaterochka','magnit','auchan','lenta','vkusvill'], tags:['veg','mushrooms'], allergens:[] },
  { id:15, name:'Блины с творогом',      price:150, emoji:'🥞', stores:['pyaterochka','magnit','auchan'],                tags:['veg'],            allergens:['gluten','milk','eggs'] },
  { id:16, name:'Тофу-боул',             price:240, emoji:'🥡', stores:['vkusvill','perekrestok'],                       tags:['veg'],            allergens:['soy'] },
  { id:17, name:'Шаурма с курицей',      price:200, emoji:'🌯', stores:['pyaterochka','magnit'],                         tags:['chicken','meat','spicy'], allergens:['gluten'] },
  { id:18, name:'Сырники',               price:140, emoji:'🧀', stores:['pyaterochka','magnit','auchan','vkusvill'],     tags:['veg'],            allergens:['gluten','milk','eggs'] },
  { id:19, name:'Котлеты из индейки',    price:230, emoji:'🍗', stores:['auchan','lenta','perekrestok'],                 tags:['meat'],           allergens:[] },
  { id:20, name:'Рис с овощами',         price:130, emoji:'🍱', stores:['pyaterochka','magnit','auchan','lenta'],        tags:['veg'],            allergens:[] },
];

/* ─────────────────────────  СОСТОЯНИЕ  ───────────────────────── */

const state = {
  step: 0,          // 0..3 — шаги, 4 — результаты
  stores: [],
  allergies: [],
  exclude: [],
  budget: 400,
};

const money = n => new Intl.NumberFormat('ru-RU').format(n) + ' ₽';
const toggle = (arr, v) => {
  const i = arr.indexOf(v);
  i === -1 ? arr.push(v) : arr.splice(i, 1);
};
const nameOf = (list, id) => (list.find(x => x.id === id) || {}).name || id;

/* ─────────────────────────  ФИЛЬТРАЦИЯ  ───────────────────────── */

function filterDishes() {
  return DISHES.filter(d => {
    // 1) есть хотя бы в одном выбранном магазине
    if (!d.stores.some(s => state.stores.includes(s))) return false;
    // 2) аллергены
    if (d.allergens.some(a => state.allergies.includes(a))) return false;
    // 3) исключения (теги)
    if (d.tags.some(t => state.exclude.includes(t))) return false;
    // 4) бюджет
    if (d.price > state.budget) return false;
    return true;
  });
}

// Жадно собираем набор блюд в рамках бюджета
function buildCombo(dishes, budget) {
  const sorted = [...dishes].sort((a, b) => b.price - a.price);
  const picked = [];
  let total = 0;
  for (const d of sorted) {
    if (picked.length >= 5) break;
    if (total + d.price <= budget) { picked.push(d); total += d.price; }
  }
  return { picked, total };
}

/* ─────────────────────────  РЕНДЕР ШАГОВ  ───────────────────────── */

function renderStores() {
  const all = state.stores.length === STORES.length;
  return `
    <h2>Шаг 1. Где закупаемся?</h2>
    <p class="hint">Выберите один или несколько магазинов — покажем блюда, которые можно собрать из их продуктов.</p>
    <div class="grid">
      ${STORES.map(s => {
        const on = state.stores.includes(s.id);
        return `<button class="option ${on ? 'active' : ''}" data-act="store" data-val="${s.id}">
          <span class="emoji">${s.emoji}</span>
          <span>${s.name}</span>
          <span class="check">${on ? '✓' : ''}</span>
        </button>`;
      }).join('')}
    </div>
    <button class="link" data-act="allstores">${all ? 'Снять выбор' : 'Выбрать все'}</button>
  `;
}

function renderAllergies() {
  return `
    <h2>Шаг 2. Есть ли аллергии?</h2>
    <p class="hint">Блюда с этими ингредиентами полностью исключим. Если аллергий нет — просто жмите «Далее».</p>
    <div class="chips">
      ${ALLERGENS.map(a => `
        <button class="chip ${state.allergies.includes(a.id) ? 'active' : ''}"
                data-act="allergy" data-val="${a.id}">${a.name}</button>`).join('')}
    </div>
  `;
}

function renderExcludes() {
  return `
    <h2>Шаг 3. Чего не хотите в меню?</h2>
    <p class="hint">Вкусы и продукты, которые не любите. Например, рыба, свинина, острое.</p>
    <div class="chips">
      ${EXCLUDES.map(a => `
        <button class="chip ${state.exclude.includes(a.id) ? 'active' : ''}"
                data-act="exclude" data-val="${a.id}">${a.name}</button>`).join('')}
    </div>
  `;
}

function renderBudget() {
  const quick = [200, 300, 500, 800, 1500];
  return `
    <h2>Шаг 4. На какую сумму?</h2>
    <p class="hint">Бюджет на одно блюдо. Покажем варианты в этих рамках и соберём набор.</p>
    <div class="budget-box">
      <div class="budget-value" id="budgetValue">${state.budget} <small>₽</small></div>
      <input type="range" id="budgetRange" min="100" max="2000" step="50" value="${state.budget}">
      <div class="quick">
        ${quick.map(v => `<button class="chip ${state.budget === v ? 'active' : ''}"
          data-act="budget" data-val="${v}">${v} ₽</button>`).join('')}
      </div>
    </div>
  `;
}

function renderResults() {
  const dishes = filterDishes();
  const { picked, total } = buildCombo(dishes, state.budget);

  const chips = [];
  if (state.stores.length) chips.push('Магазины: <b>' + state.stores.map(s => nameOf(STORES, s)).join(', ') + '</b>');
  chips.push('Аллергии: <b>' + (state.allergies.length ? state.allergies.map(a => nameOf(ALLERGENS, a)).join(', ') : 'нет') + '</b>');
  chips.push('Исключено: <b>' + (state.exclude.length ? state.exclude.map(a => nameOf(EXCLUDES, a)).join(', ') : 'ничего') + '</b>');
  chips.push('Бюджет: <b>' + money(state.budget) + '</b>');

  if (!dishes.length) {
    return `
      <h2>Ничего не нашлось 😔</h2>
      <div class="summary">${chips.join('<br>')}</div>
      <div class="empty" style="margin-top:16px">
        Попробуйте увеличить бюджет, добавить магазин или убрать одно из исключений.
      </div>`;
  }

  return `
    <h2>Готово! Нашлось блюд: ${dishes.length}</h2>
    <div class="summary">${chips.join('<br>')}</div>

    <h3>🍽 Набор в рамках бюджета</h3>
    ${picked.map(d => dishCard(d)).join('')}
    <div class="total">
      <span>Итого</span>
      <span>${money(total)} из ${money(state.budget)}</span>
    </div>

    <h3>Все подходящие блюда</h3>
    ${dishes.sort((a, b) => a.price - b.price).map(d => dishCard(d)).join('')}
  `;
}

function dishCard(d) {
  const stores = d.stores.filter(s => state.stores.includes(s)).map(s => nameOf(STORES, s));
  return `
    <div class="dish">
      <div class="dish-emoji">${d.emoji}</div>
      <div class="dish-body">
        <div class="dish-name">${d.name}</div>
        <div class="dish-meta">${stores.join(' · ')}</div>
      </div>
      <div class="dish-price">${money(d.price)}</div>
    </div>`;
}

/* ─────────────────────────  УПРАВЛЕНИЕ  ───────────────────────── */

const STEPS = [renderStores, renderAllergies, renderExcludes, renderBudget];
const main = document.getElementById('main');
const backBtn = document.getElementById('back');
const nextBtn = document.getElementById('next');
const bar = document.getElementById('bar');

function canGoNext() {
  if (state.step === 0) return state.stores.length > 0;
  return true;
}

function render() {
  if (state.step === 4) {
    main.innerHTML = renderResults();
  } else {
    main.innerHTML = STEPS[state.step]();
  }

  // прогресс + кнопки
  const pct = state.step === 4 ? 100 : ((state.step + 1) / 4) * 100;
  bar.style.width = pct + '%';

  if (state.step === 4) {
    backBtn.textContent = 'Заново';
    backBtn.disabled = false;
    nextBtn.textContent = 'Изменить условия';
  } else {
    backBtn.textContent = 'Назад';
    backBtn.disabled = state.step === 0;
    nextBtn.textContent = state.step === 3 ? 'Подобрать' : 'Далее';
    nextBtn.disabled = !canGoNext();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

nextBtn.addEventListener('click', () => {
  if (state.step === 4) { state.step = 0; render(); return; }
  if (state.step === 3) { state.step = 4; render(); return; }
  state.step++; render();
});

backBtn.addEventListener('click', () => {
  if (state.step === 4) { state.step = 0; render(); return; }
  if (state.step > 0) { state.step--; render(); }
});

// клики по опциям
main.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, val } = el.dataset;

  if (act === 'store')   toggle(state.stores, val);
  if (act === 'allergy') toggle(state.allergies, val);
  if (act === 'exclude') toggle(state.exclude, val);
  if (act === 'budget')  state.budget = +val;
  if (act === 'allstores') {
    state.stores = state.stores.length === STORES.length ? [] : STORES.map(s => s.id);
  }
  render();
});

// слайдер бюджета — без перерисовки, чтобы не дёргался
main.addEventListener('input', e => {
  if (e.target.id !== 'budgetRange') return;
  state.budget = +e.target.value;
  document.getElementById('budgetValue').innerHTML = state.budget + ' <small>₽</small>';
  main.querySelectorAll('[data-act="budget"]').forEach(b => {
    b.classList.toggle('active', +b.dataset.val === state.budget);
  });
});

render();
</script>
</body>
</html>
