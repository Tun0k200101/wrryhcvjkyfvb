<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0c14">
<title>CS2 Кейсы Pro</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 70% at 50% 0%,#1c2447 0%,#0b0e18 55%,#06070c 100%) fixed;
  color:#e8ecf8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  min-height:100vh;min-height:100dvh;overflow-x:hidden;
}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
input{font-family:inherit}

/* Layout */
.app{max-width:600px;margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(95px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.brand{font-size:15px;font-weight:900;letter-spacing:1.2px;white-space:nowrap;
  background:linear-gradient(90deg,#ffd76a,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.hdrRight{display:flex;align-items:center;gap:6px}
.iconBtn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);font-size:14px;display:flex;align-items:center;justify-content:center}
.iconBtn.off{opacity:.4}
.balance{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);padding:6px 11px;border-radius:999px;font-weight:800;font-size:13px}

/* Level bar */
.lvlBar{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:0 2px}
.lvlBadge{font-size:11px;font-weight:900;background:linear-gradient(135deg,#ffb347,#ff6b35);
  color:#12131c;padding:3px 8px;border-radius:6px;white-space:nowrap}
.lvlTrack{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.lvlFill{height:100%;background:linear-gradient(90deg,#ffb347,#ff6b35);
  border-radius:999px;transition:width .4s;box-shadow:0 0 10px rgba(255,120,60,.5)}
.lvlText{font-size:10px;opacity:.65;font-weight:700;white-space:nowrap}

/* Views */
.view{display:none;animation:fadeIn .25s}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sectionTitle{font-size:12px;font-weight:800;letter-spacing:.8px;opacity:.55;margin:14px 2px 8px}
.tabs{display:flex;gap:7px;overflow-x:auto;margin:0 -12px 10px;padding:0 12px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 13px;border-radius:999px;font-size:12px;font-weight:700;
  white-space:nowrap;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.tab.active{background:linear-gradient(135deg,#ffb347,#ff6b35);border-color:transparent;
  box-shadow:0 4px 12px rgba(255,120,60,.35)}

/* Case grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.case-card{position:relative;border-radius:16px;padding:13px 8px 11px;
  background:linear-gradient(165deg,#1b2340,#10131f 70%);
  border:1px solid rgba(255,255,255,.08);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:transform .13s;overflow:hidden}
.case-card::before{content:'';position:absolute;top:-60%;left:-30%;width:160%;height:120%;
  background:radial-gradient(circle,rgba(120,160,255,.14),transparent 65%);pointer-events:none}
.case-card:active{transform:scale(.955)}
.caseIcon{font-size:36px;line-height:1;filter:drop-shadow(0 4px 10px rgba(120,160,255,.35))}
.caseName{font-size:12px;font-weight:700;text-align:center;line-height:1.15;min-height:27px;
  display:flex;align-items:center}
.casePrice{font-size:11px;font-weight:800;color:#ffd76a}
.case-card.free .casePrice{color:#4bff88}

/* Daily strip */
.dailyStrip{background:linear-gradient(135deg,#2a1a4a,#1a1a3a);border:1px solid rgba(180,120,255,.35);
  border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.dailyStrip .dIcon{font-size:24px}
.dailyStrip .dText{flex:1;font-size:13px;font-weight:700;line-height:1.3}
.dailyStrip .dText span{font-size:11px;opacity:.65;font-weight:600;display:block}
.dailyStrip button{padding:9px 14px;border-radius:10px;font-size:12px;font-weight:800;
  background:linear-gradient(135deg,#a855f7,#7c3aed);box-shadow:0 4px 14px rgba(140,60,255,.35)}
.dailyStrip button:active{transform:scale(.95)}
.dailyStrip.claimed{opacity:.55}
.dailyStrip.claimed button{background:rgba(255,255,255,.1);box-shadow:none}

/* Item row */
.row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;
  background:linear-gradient(180deg,rgba(14,17,27,.35),rgba(14,17,27,.9)),var(--g);
  border:1px solid rgba(255,255,255,.07);border-left:3px solid var(--c);
  cursor:pointer;position:relative;overflow:hidden;margin-bottom:7px}
.row:active{transform:scale(.985)}
.rowEmoji{font-size:24px;line-height:1;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
.rowImg{width:38px;height:28px;object-fit:contain}
.rowInfo{flex:1;min-width:0}
.rowName{font-size:12.5px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowRar{font-size:9.5px;font-weight:800;letter-spacing:.5px;opacity:.75;color:var(--c);margin-top:1px}
.rowPrice{font-size:12.5px;font-weight:800;color:#ffd76a;white-space:nowrap}
.row.selected{background:linear-gradient(180deg,rgba(80,120,255,.18),rgba(40,60,150,.15));border-left-width:4px}

/* Item mini card */
.miniGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.mini{background:linear-gradient(180deg,rgba(14,17,27,.35),rgba(14,17,27,.9)),var(--g);
  border:1px solid rgba(255,255,255,.08);border-bottom:2px solid var(--c);
  border-radius:10px;padding:8px 4px 6px;text-align:center;cursor:pointer;
  transition:transform .12s}
.mini:active{transform:scale(.95)}
.mini .iemoji{font-size:24px;line-height:1;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
.mini .iname{font-size:8.5px;font-weight:600;opacity:.75;line-height:1.1;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .iprice{font-size:9.5px;font-weight:800;color:#ffd76a;margin-top:2px}
.mini.sel{border-color:#4b8aff;box-shadow:0 0 0 2px rgba(75,138,255,.4)}

/* Bottom nav */
.bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(6,7,12,.6),rgba(6,7,12,.98) 40%);
  display:flex;gap:3px;max-width:600px;margin:0 auto;
  border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.navBtn{flex:1;padding:8px 2px;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:9px;font-weight:700;opacity:.55;transition:.15s}
.navBtn .navIco{font-size:18px;line-height:1}
.navBtn.active{opacity:1;background:rgba(255,255,255,.06)}
.navBtn:active{transform:scale(.93)}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:50;
  background:radial-gradient(110% 60% at 50% 0%,#1a2244,#07090f 70%);
  display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.overlay.show{display:flex}
.overlayScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 14px}
.closeBtn{width:36px;height:36px;border-radius:11px;flex:0 0 auto;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:15px;
  display:flex;align-items:center;justify-content:center}
.closeBtn:active{background:rgba(255,255,255,.14)}
.modalHead{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.modalTitle{font-size:16px;font-weight:800}

/* Modal content */
.modalSection{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  border-radius:14px;padding:14px;margin-bottom:10px}
.modalSection h3{font-size:12px;font-weight:800;opacity:.6;letter-spacing:.5px;margin-bottom:10px}
.statRow{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.statRow:last-child{border-bottom:none}
.statRow .sLbl{opacity:.65;font-weight:600}
.statRow .sVal{font-weight:800}

/* Buttons */
.btn{width:100%;padding:15px;border-radius:15px;font-size:14px;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(135deg,#ffb347,#ff6b35 55%,#e8412d);color:#fff;
  box-shadow:0 8px 24px rgba(255,110,50,.3);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#ffd76a,#ff9a3d);color:#1a1208}
.btn.small{padding:10px;font-size:12px;border-radius:12px;width:auto}
.btnRow{display:flex;gap:8px}

/* Open screen (roulette) */
.openTop{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.caseTitle{font-size:15px;font-weight:700;opacity:.9}
.roulette{position:relative;height:calc(var(--iw) * 1.32);margin:20px -12px 0;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 11%,#000 89%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0%,#000 11%,#000 89%,transparent 100%)}
.track{display:flex;will-change:transform;height:100%;align-items:center}
.item{width:var(--iw);height:calc(var(--iw) * 1.15);flex:0 0 auto;border-radius:12px;
  background:linear-gradient(180deg,rgba(14,17,27,.4),rgba(14,17,27,.92)),var(--g);
  border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;position:relative;overflow:hidden;padding:4px;
  box-shadow:inset 0 0 22px var(--c)}
.item::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:var(--c);box-shadow:0 0 10px var(--c)}
.iemoji{font-size:calc(var(--iw) * .37);line-height:1;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.6)) drop-shadow(0 0 6px rgba(255,255,255,.25))}
.imedia{width:calc(var(--iw) * .72);height:calc(var(--iw) * .5);object-fit:contain;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.iname{font-size:8.5px;line-height:1.15;text-align:center;opacity:.7;padding:0 2px;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.marker{position:absolute;top:-2px;bottom:-2px;left:50%;width:3px;margin-left:-1.5px;
  background:linear-gradient(180deg,#ffd76a,#ff8a3d);box-shadow:0 0 14px rgba(255,180,80,.95);
  z-index:5;border-radius:2px;pointer-events:none}
.marker::before,.marker::after{content:'';position:absolute;left:50%;transform:translateX(-50%);
  border-left:7px solid transparent;border-right:7px solid transparent}
.marker::before{top:0;border-top:9px solid #ffd76a}
.marker::after{bottom:0;border-bottom:9px solid #ffd76a}
.openBottom{margin-top:auto;padding:0 16px 22px;display:flex;flex-direction:column;gap:10px}
.fastRow{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;opacity:.75}
.fastRow .sw{width:38px;height:22px;border-radius:999px;background:rgba(255,255,255,.12);
  position:relative;transition:.2s;flex:0 0 auto}
.fastRow .sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;
  border-radius:50%;background:#fff;transition:.2s}
.fastRow.on .sw{background:linear-gradient(135deg,#ffb347,#ff6b35)}
.fastRow.on .sw::after{left:19px}

/* Result */
#resultScreen{align-items:center;justify-content:center;padding:24px}
.resultCard{width:100%;max-width:340px;border-radius:24px;padding:22px 18px 18px;
  background:linear-gradient(170deg,#1a2138,#0c0f18);border:1px solid rgba(255,255,255,.1);
  display:flex;flex-direction:column;align-items:center;gap:12px;
  animation:pop .38s cubic-bezier(.2,1.5,.5,1);position:relative;overflow:hidden}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.resultGlow{position:absolute;top:-50%;left:-20%;width:140%;height:120%;
  background:radial-gradient(circle,var(--rc),transparent 62%);opacity:.3;pointer-events:none}
.resultRar{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--rc);
  position:relative;z-index:1}
.resultPreview{width:170px;height:140px;border-radius:16px;position:relative;z-index:1;
  background:linear-gradient(180deg,rgba(14,17,27,.35),rgba(14,17,27,.9)),var(--rg);
  border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 30px var(--rc),0 0 40px rgba(0,0,0,.4)}
.resultPreview .iemoji{font-size:76px}
.resultName{font-size:17px;font-weight:800;text-align:center;line-height:1.25;
  position:relative;z-index:1;padding:0 4px}
.resultPrice{font-size:15px;font-weight:800;color:#ffd76a;position:relative;z-index:1}
.resultBtns{display:flex;gap:8px;width:100%;margin-top:4px;position:relative;z-index:1}

/* Upgrade view */
.upSection{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  border-radius:16px;padding:14px;margin-bottom:10px}
.upSection h3{font-size:12px;font-weight:800;opacity:.6;letter-spacing:.5px;margin-bottom:10px}
.upPick{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:linear-gradient(180deg,rgba(14,17,27,.4),rgba(14,17,27,.9)),var(--g);
  border-radius:12px;border:1px solid rgba(255,255,255,.08);
  border-left:3px solid var(--c);cursor:pointer}
.upPick:active{transform:scale(.985)}
.upPick .uEmoji{font-size:28px}
.upPick .uInfo{flex:1;min-width:0}
.upPick .uName{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upPick .uPrice{font-size:11px;font-weight:800;color:#ffd76a;margin-top:2px}
.arrow{text-align:center;font-size:22px;opacity:.4;margin:6px 0}
.chance{text-align:center;font-size:32px;font-weight:900;
  background:linear-gradient(135deg,#ffd76a,#ff6b35);-webkit-background-clip:text;
  background-clip:text;color:transparent;letter-spacing:-1px;margin:6px 0}

/* Contract */
.contractGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.cSlot{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.04);
  border:1px dashed rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;
  font-size:22px;color:rgba(255,255,255,.15)}
.cSlot.filled{background:linear-gradient(180deg,rgba(14,17,27,.35),rgba(14,17,27,.9)),var(--g);
  border-style:solid;border-color:var(--c);border-bottom-width:3px;cursor:pointer}
.cSlot.filled .iemoji{font-size:24px}
.sel{color:#4bff88}

/* Shop */
.shopGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.shopCard{background:linear-gradient(180deg,rgba(14,17,27,.35),rgba(14,17,27,.9)),var(--g);
  border:1px solid rgba(255,255,255,.08);border-bottom:2px solid var(--c);
  border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;transition:.12s}
.shopCard:active{transform:scale(.95)}
.shopCard .iemoji{font-size:30px}
.shopCard .sName{font-size:10px;font-weight:700;line-height:1.15;margin-top:4px;min-height:22px}
.shopCard .sPrice{font-size:11px;font-weight:800;color:#ffd76a;margin-top:3px}

/* Achievements */
.achItem{display:flex;align-items:center;gap:11px;padding:11px 12px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  border-radius:12px;margin-bottom:7px}
.achItem.done{border-color:rgba(75,255,136,.35);background:rgba(75,255,136,.06)}
.achIcon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.achItem.done .achIcon{background:rgba(75,255,136,.18)}
.achInfo{flex:1;min-width:0}
.achName{font-size:13px;font-weight:800}
.achDesc{font-size:11px;opacity:.6;margin-top:1px}
.achReward{font-size:11px;font-weight:800;color:#ffd76a;white-space:nowrap}
.achItem.done .achReward{color:#4bff88}

/* Promo */
.promoInput{width:100%;padding:14px;border-radius:12px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);color:#fff;font-size:15px;font-weight:700;
  text-align:center;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.promoInput::placeholder{text-transform:none;letter-spacing:0;font-weight:600;opacity:.4}

/* Daily overlay */
#dailyScreen{align-items:center;justify-content:center;padding:22px}
.dailyCard{width:100%;max-width:360px;background:linear-gradient(170deg,#2a1a4a,#10131f);
  border:1px solid rgba(180,120,255,.3);border-radius:22px;padding:20px 16px;
  animation:pop .4s cubic-bezier(.2,1.5,.5,1)}
.dailyCard h2{font-size:18px;font-weight:900;text-align:center;margin-bottom:4px}
.dailyCard p{font-size:12px;text-align:center;opacity:.65;margin-bottom:16px}
.dayGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.dayCell{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-radius:10px;padding:9px 4px;text-align:center}
.dayCell .dn{font-size:9px;font-weight:800;opacity:.5}
.dayCell .dr{font-size:12px;font-weight:900;color:#ffd76a;margin-top:3px}
.dayCell.done{opacity:.5;border-color:rgba(75,255,136,.35)}
.dayCell.today{background:linear-gradient(135deg,#a855f7,#7c3aed);border-color:transparent}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);z-index:99;background:rgba(30,36,58,.97);
  border:1px solid rgba(255,255,255,.14);padding:11px 18px;border-radius:13px;
  font-size:12.5px;font-weight:700;opacity:0;transition:.28s;pointer-events:none;
  white-space:nowrap;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Upgrade result */
#upModal .resultPreview,#contractModal .resultPreview{width:140px;height:120px}
#upModal .resultPreview .iemoji,#contractModal .resultPreview .iemoji{font-size:64px}
.upPair{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.upPair .p1,.upPair .p2{text-align:center}
.upPair .pEmoji{font-size:44px;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.upPair .pName{font-size:10px;font-weight:700;margin-top:4px;max-width:90px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;opacity:.7}
.upPair .pArrow{font-size:22px;color:#ffd76a}
.upResult{font-size:22px;font-weight:900;text-align:center;letter-spacing:1px;margin-top:4px}
.upResult.win{color:#4bff88}
.upResult.lose{color:#ff5555}

.empty{text-align:center;opacity:.4;font-size:13px;padding:40px 20px;line-height:1.6}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">🎁 CS2 PRO</div>
    <div class="hdrRight">
      <button class="iconBtn" id="soundBtn">🔊</button>
      <div class="balance">💰 <span id="balance">1000</span></div>
    </div>
  </header>
  <div class="lvlBar">
    <div class="lvlBadge">LVL <span id="lvlNum">1</span></div>
    <div class="lvlTrack"><div class="lvlFill" id="lvlFill" style="width:0%"></div></div>
    <div class="lvlText" id="lvlText">0/100</div>
  </div>

  <!-- VIEW: CASES -->
  <div class="view active" id="view-cases">
    <div class="dailyStrip" id="dailyStrip">
      <div class="dIcon">🎁</div>
      <div class="dText">Ежедневный бонус<span id="dailySub">День 1 из 7</span></div>
      <button id="dailyBtn">Забрать</button>
    </div>
    <div class="sectionTitle">БЕСПЛАТНЫЙ КЕЙС</div>
    <div class="grid" style="grid-template-columns:1fr;margin-bottom:12px" id="freeCaseArea"></div>

/* ============ РАЗМЕРЫ ============ */
let ITEM_W = 100, GAP = 8, TOTAL = 108;
function measure(){
  ITEM_W = Math.min(110, Math.max(72, window.innerWidth * 0.255));
  GAP = 8; TOTAL = ITEM_W + GAP;
  document.documentElement.style.setProperty('--iw', ITEM_W + 'px');
  track.style.gap = GAP + 'px';
}

/* ============ ЗВУК ============ */
let actx = null;
function initAudio(){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
  }catch(e){}
}
function blip(freq, dur, type, vol){
  if(!actx || !state.settings.sound) return;
  try{
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .04, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + .01);
  }catch(e){}
}
function revealSound(r){
  if(!actx || !state.settings.sound) return;
  const base = {consumer:330, industrial:392, milspec:440, restricted:494, classified:554, covert:659, rare:880}[r] || 400;
  [0,90,190,320].forEach((d,i) => setTimeout(() => blip(base*(1+i*.26), .22, 'sine', .09), d));
}
function vibrate(p){ if(navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }

/* ============ HUD ============ */
function updateHUD(){
  $('balance').textContent = Math.round(state.balance).toLocaleString('ru');
  $('lvlNum').textContent = state.stats.level;
  const need = state.stats.level * 100;
  const pct = Math.min(100, (state.stats.xp / need) * 100);
  $('lvlFill').style.width = pct + '%';
  $('lvlText').textContent = Math.floor(state.stats.xp) + '/' + need;
  $('soundBtn').classList.toggle('off', !state.settings.sound);
  $('fastRow').classList.toggle('on', state.settings.fast);

  // Daily strip
  const today = new Date().toDateString();
  const claimed = state.stats.lastDaily === today;
  const strip = $('dailyStrip');
  strip.classList.toggle('claimed', claimed);
  $('dailyBtn').disabled = claimed;
  $('dailyBtn').textContent = claimed ? '✓' : 'Забрать';
  $('dailySub').textContent = 'День ' + Math.min(7, state.stats.dailyStreak + (claimed?0:1)) + ' из 7';
}

/* ============ XP ============ */
function addXP(amount){
  state.stats.xp += amount;
  const need = () => state.stats.level * 100;
  while (state.stats.xp >= need()){
    state.stats.xp -= need();
    state.stats.level++;
    const reward = state.stats.level * 100;
    state.balance += reward;
    toast('🎉 Уровень ' + state.stats.level + '! +' + reward + ' 💰');
    blip(660, .12, 'sine', .09);
    setTimeout(() => blip(880, .16, 'sine', .09), 110);
    setTimeout(() => blip(1100, .2, 'sine', .09), 230);
  }
}

/* ============ ДОСТИЖЕНИЯ ============ */
function checkAchievements(){

  ACHIEVEMENTS.forEach(a => {
    if (!state.ach[a.id] && a.check(state)){

      state.balance += a.r;

    save(); updateHUD();
    unlocked.forEach((a,i) => setTimeout(() => toast('🏆 ' + a.n + ' +' + a.r + '💰'), i*800));

}

/* ============ РОЛЛ ============ */
function pickRarity(c){
  const keys = Object.keys(c.odds);
  let total = 0; keys.forEach(k => total += c.odds[k]);
  let r = Math.random() * total;
  for (const k of keys){ r -= c.odds[k]; if (r <= 0) return k; }
  return keys[0];
}
function rollItem(c){
  const rar = pickRarity(c);
  const pool = ITEMS.filter(i => i.r === rar);
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : ITEMS[0];
}

/* ============ ЭКРАН ОТКРЫТИЯ ============ */
let currentCase = null, isFree = false, spinning = false;
const STRIP_LEN = 60, WIN_INDEX = 52;

function openCase(c, free){
  currentCase = c; isFree = !!free;
  caseTitle.textContent = c.icon + ' ' + c.name;
  openBtn.textContent = free ? 'ОТКРЫТЬ БЕСПЛАТНО' : ('ОТКРЫТЬ · ' + c.price.toLocaleString('ru') + ' 💰');
  openBtn.disabled = false;
  spinning = false;
  measure();
  buildStrip(rollItem(c), true);
  track.style.transition = 'none';
  track.style.transform = 'translate3d(0,0,0)';
  $('openScreen').classList.add('show');
}
function buildStrip(winner, quiet){
  track.style.transition = 'none';
  track.style.transform = 'translate3d(0,0,0)';
  track.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < STRIP_LEN; i++){
    const it = (i === WIN_INDEX) ? winner : rollItem(currentCase);
    const d = document.createElement('div');
    d.className = 'item';
    d.style.setProperty('--c', RAR[it.r].c);
    d.style.setProperty('--g', it.g);
    d.innerHTML = media(it) + '<div class="iname">' + it.n + '</div>';
    frag.appendChild(d);
  }
  track.appendChild(frag);
  if (!quiet) void track.offsetWidth;
}

function doOpen(){
  if (spinning || !currentCase) return;
  if (!isFree && state.balance < currentCase.price){ toast('Недостаточно монет 💰'); vibrate(60); return; }
  initAudio();
  if (!isFree){
    state.balance -= currentCase.price;
    state.stats.spent += currentCase.price;
  }
  state.stats.opens++;
  save(); updateHUD();

  const winner = rollItem(currentCase);
  spinning = true;
  openBtn.disabled = true;
  openBtn.textContent = 'КРУТИМ...';
  buildStrip(winner);
  void track.offsetWidth;

  const W = roulette.clientWidth;
  const jitter = (Math.random() * .62 - .31) * ITEM_W;
  const finalX = W/2 - (WIN_INDEX * TOTAL + ITEM_W/2) + jitter;
  const DUR = state.settings.fast ? 1600 : 4800;
  track.style.transition = 'transform ' + DUR + 'ms cubic-bezier(.08,.62,.08,1)';
  track.style.transform = 'translate3d(' + finalX + 'px,0,0)';

  let lastIdx = -1;
  (function tickLoop(){
    if (!spinning) return;
    const rr = roulette.getBoundingClientRect();
    const tr = track.getBoundingClientRect();
    const idx = Math.floor((rr.left + rr.width/2 - tr.left) / TOTAL);
    if (idx !== lastIdx){ lastIdx = idx; blip(1400, .028, 'square', .03); }
    requestAnimationFrame(tickLoop);
  })();

  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    track.removeEventListener('transitionend', finish);
    spinning = false;
    openBtn.disabled = false;
    openBtn.textContent = isFree ? 'ОТКРЫТЬ БЕСПЛАТНО' : ('ОТКРЫТЬ · ' + currentCase.price.toLocaleString('ru') + ' 💰');
    state.inventory.push(winner);
    if (!state.stats.best || winner.p > state.stats.best.p) state.stats.best = winner;
    addXP(10 + Math.floor(winner.p / 5));
    save(); updateHUD(); checkAchievements();
    showResult(winner);
  };
  track.addEventListener('transitionend', finish);
  setTimeout(finish, DUR + 500);
}

  $('resultGlow').style.background = 'radial-gradient(circle,' + R.c + ',transparent 62%)';
  $('resultRar').textContent = R.n;
  $('resultRar').style.color = R.c;
  const prev = $('resultPreview');

  prev.style.setProperty('--rg', item.g);

function renderUpgrade(){
  const box = $('upgradeBox');

  if (!upSource){

      '<div id="upSrcList"></div></div>';

    [...state.inventory].sort((a,b) => b.p - a.p).forEach(it => {
      const el = document.createElement('div');
      el.className = 'upPick';
      el.style.setProperty('--c', RAR[it.r].c);
      el.style.setProperty('--g', it.g);

      el.onclick = () => {
        upSource = it;
        generateUpTargets();
        renderUpgrade();
      };
      list.appendChild(el);
    });
  } else {
    let html =
      '<div class="upSection"><h3>ТВОЙ ПРЕДМЕТ</h3>' +
      '<div class="upPick" style="--c:' + RAR[upSource.r].c + ';--g:' + upSource.g + '">' +
        mediaMini(upSource) +
        '<div class="uInfo"><div class="uName">' + upSource.n + '</div>' +
        '<div class="uPrice">' + upSource.p.toLocaleString('ru') + ' 💰</div></div>' +
      '</div>' +
      '<button class="btn secondary small" id="upReset" style="width:100%;margin-top:8px">← Сменить предмет</button>' +
      '</div>';
    if (!upOptions.length){
      html += '<div class="upSection"><div class="empty">Нет подходящих целей для апгрейда.<br>Нужен предмет дороже.</div></div>';
    } else {
      html += '<div class="upSection"><h3>ВЫБЕРИ ЦЕЛЬ</h3><div id="upTargets"></div></div>';
      if (upTarget){
        const chance = Math.min(90, Math.max(5, (upSource.p / upTarget.p) * 100));
        html += '<div class="chance">' + chance.toFixed(1) + '%</div>' +
          '<button class="btn" id="upDo">УЛУЧШИТЬ</button>';
      } else {
        html += '<div style="text-align:center;font-size:12px;opacity:.5;margin-top:8px">Выбери цель выше</div>';
      }
    }
    box.innerHTML = html;
    const rb = $('upReset'); if (rb) rb.onclick = () => { upSource = upTarget = null; renderUpgrade(); };
    const tl = $('upTargets');
    if (tl){
      upOptions.forEach(it => {
        const el = document.createElement('div');
        el.className = 'upPick';
        if (upTarget && upTarget.id === it.id) el.style.boxShadow = '0 0 0 2px #4b8aff';
        el.style.setProperty('--c', RAR[it.r].c);
        el.style.setProperty('--g', it.g);
        const c = Math.min(90, Math.max(5, (upSource.p / it.p) * 100));
        el.innerHTML = mediaMini(it) +
          '<div class="uInfo"><div class="uName">' + it.n + '</div>' +
          '<div class="uPrice">' + it.p.toLocaleString('ru') + ' 💰 · ' + c.toFixed(1) + '%</div></div>';
        el.onclick = () => { upTarget = it; renderUpgrade(); };
        tl.appendChild(el);
      });
    }
    const db = $('upDo');
    if (db) db.onclick = doUpgrade;
  }
}
function generateUpTargets(){
  const pool = ITEMS.filter(i => i.p > upSource.p && i.p < upSource.p * 20);
  upOptions = [];
  const shuffled = [...pool].sort(() => Math.random() - .5);
  const seen = new Set();
  for (const it of shuffled){
    if (upOptions.length >= 6) break;
    if (!seen.has(it.id)){ seen.add(it.id); upOptions.push(it); }
  }
  upTarget = null;
}
function doUpgrade(){
  if (!upSource || !upTarget) return;
  const chance = Math.min(90, Math.max(5, (upSource.p / upTarget.p) * 100));
  const win = Math.random() * 100 < chance;

  // Remove source from inventory
  const idx = state.inventory.indexOf(upSource);
  if (idx < 0){ toast('Предмет пропал'); return; }

  if (win){
    state.inventory.splice(idx, 1, upTarget);
    state.stats.upgraded++;
    if (!state.stats.best || upTarget.p > state.stats.best.p) state.stats.best = upTarget;
    addXP(30);
  } else {
    state.inventory.splice(idx, 1);
  }
  save(); updateHUD(); checkAchievements();

  showUpModal(win ? upTarget : upSource, upTarget, win);

  upSource = upTarget = null;
  upOptions = [];
  setTimeout(() => renderUpgrade(), 400);
}
function showUpModal(item, target, win){
  const R = RAR[item.r];
  const body = $('modalBody');
  $('modalTitle').textContent = win ? '✨ УСПЕХ' : '💔 ПРОВАЛ';
  body.innerHTML =
    '<div class="upPair">' +
      '<div class="p1"><div class="pEmoji">' + item.e + '</div><div class="pName">' + item.n + '</div></div>' +
    '</div>' +
    '<div class="upResult ' + (win ? 'win' : 'lose') + '">' + (win ? 'УЛУЧШЕНО' : 'ПРЕДМЕТ ПОТЕРЯН') + '</div>' +
    '<div style="margin-top:14px"><button class="btn" id="upModalOk">ОК</button></div>';
  $('modalScreen').classList.add('show');
  $('modalClose').style.display = 'block';
  setTimeout(() => {
    const b = $('upModalOk');
    if (b) b.onclick = () => $('modalScreen').classList.remove('show');
  }, 20);
  if (win) revealSound(item.r);
  else blip(160, .3, 'sawtooth', .06);
  vibrate(win ? [50,40,80] : 100);
}

/* ============ КОНТРАКТ ============ */
let contractRar = 'consumer';
let contractSel = [];
function renderContract(){
  const box = $('contractBox');
  const rEl = $('contractRarities');
  rEl.innerHTML = '';
  // Show rarity chips that have >= 1 item of NEXT tier
  RAR_ORDER.slice(0, -1).forEach(r => {
    const b = document.createElement('button');
    b.className = 'tab' + (contractRar === r ? ' active' : '');
    b.textContent = RAR[r].n;
    b.style.borderLeft = '3px solid ' + RAR[r].c;
    b.onclick = () => { contractRar = r; contractSel = []; renderContract(); };
    rEl.appendChild(b);
  });
  const avail = state.inventory.filter(i => i.r === contractRar);
  const nextRar = RAR_ORDER[RAR_ORDER.indexOf(contractRar) + 1];

  let html =
    '<div class="upSection"><h3>ВЫБРАНО ' + contractSel.length + ' / 10 · ' + RAR[contractRar].n + '</h3>' +
    '<div class="contractGrid" id="cSlots"></div>' +
    '<div style="font-size:12px;opacity:.6;text-align:center;margin-bottom:8px">' +
      'Заменяем 10 предметов на 1 из <b style="color:' + RAR[nextRar].c + '">' + RAR[nextRar].n + '</b>' +
    '</div>' +
    '<button class="btn' + (contractSel.length === 10 ? '' : ' secondary') + '" id="contractDo" ' +
      (contractSel.length === 10 ? '' : 'disabled') + '>ЗАКЛЮЧИТЬ КОНТРАКТ</button>' +
    '</div>';

  html += '<div class="upSection"><h3>ТВОИ ПРЕДМЕТЫ</h3>' +
    '<div class="miniGrid" id="cItems"></div></div>';
  box.innerHTML = html;

  // Slots
  const slots = $('cSlots');
  for (let i = 0; i < 10; i++){
    const s = document.createElement('div');
    const it = contractSel[i];
    if (it){
      s.className = 'cSlot filled';
      s.style.setProperty('--c', RAR[it.r].c);
      s.style.setProperty('--g', it.g);
      s.innerHTML = '<div class="iemoji">' + it.e + '</div>';
      s.onclick = () => { contractSel.splice(i, 1); renderContract(); };
    } else {
      s.className = 'cSlot';
      s.textContent = '+';
    }
    slots.appendChild(s);
  }

  // Available items
  const g = $('cItems');
  if (!avail.length){
    g.innerHTML = '<div class="empty" style="grid-column:1/-1">Нет предметов этой редкости</div>';
  } else {
    avail.forEach(it => {
      const isSel = contractSel.some(x => x === it);
      const card = document.createElement('div');
      card.className = 'mini' + (isSel ? ' sel' : '');
      card.style.setProperty('--c', RAR[it.r].c);
      card.style.setProperty('--g', it.g);
      card.innerHTML = '<div class="iemoji">' + it.e + '</div>' +
        '<div class="iname">' + it.n + '</div>' +
        '<div class="iprice">' + it.p + ' 💰</div>';
      card.onclick = () => {
        if (isSel){
          const idx = contractSel.indexOf(it);
          contractSel.splice(idx, 1);
        } else if (contractSel.length < 10){
          contractSel.push(it);
        }
        renderContract();
      };
      g.appendChild(card);
    });
  }

  const db = $('contractDo');
  if (db) db.onclick = doContract;
}
function doContract(){
  if (contractSel.length !== 10) return;
  const nextRar = RAR_ORDER[RAR_ORDER.indexOf(contractRar) + 1];
  const pool = ITEMS.filter(i => i.r === nextRar);
  const winner = pool[Math.floor(Math.random() * pool.length)];

  // Remove selected items
  contractSel.forEach(it => {
    const idx = state.inventory.indexOf(it);
    if (idx >= 0) state.inventory.splice(idx, 1);
  });
  state.inventory.push(winner);
  state.stats.contracts++;
  if (!state.stats.best || winner.p > state.stats.best.p) state.stats.best = winner;
  addXP(20);
  save(); updateHUD(); checkAchievements();

  contractSel = [];
  renderContract();

  showContractModal(winner);
}
function showContractModal(item){
  const R = RAR[item.r];
  $('modalTitle').textContent = '🔄 КОНТРАКТ ЗАКЛЮЧЁН';
  const body = $('modalBody');
  body.innerHTML =
    '<div style="text-align:center;margin:12px 0">' +
      '<div style="font-size:11px;font-weight:900;letter-spacing:2px;color:' + R.c + ';text-transform:uppercase">' + R.n + '</div>' +
      '<div class="resultPreview" style="--rc:' + R.c + ';--rg:' + item.g + ';margin:12px auto">' + media(item) + '</div>' +
      '<div style="font-size:18px;font-weight:900">' + item.n + '</div>' +
      '<div style="font-size:15px;font-weight:800;color:#ffd76a;margin-top:6px">' + item.p.toLocaleString('ru') + ' 💰</div>' +
    '</div>' +
    '<button class="btn" id="cModalOk">ОК</button>';
  $('modalScreen').classList.add('show');
  setTimeout(() => {
    const b = $('cModalOk');
    if (b) b.onclick = () => $('modalScreen').classList.remove('show');
  }, 20);
  revealSound(item.r);
  vibrate([50, 60, 80]);
}

/* ============ МАГАЗИН ============ */
function showShop(){
  $('modalTitle').textContent = '🛒 Магазин';
  const body = $('modalBody');
  body.innerHTML = '<div class="shopGrid" id="shopGrid"></div>';
  const g = $('shopGrid');
  [...ITEMS].sort((a,b) => RAR[a.r].w - RAR[b.r].w || a.p - b.p).forEach(it => {
    const card = document.createElement('div');
    card.className = 'shopCard';
    card.style.setProperty('--c', RAR[it.r].c);
    card.style.setProperty('--g', it.g);
    card.innerHTML = '<div class="iemoji">' + it.e + '</div>' +
      '<div class="sName">' + it.n + '</div>' +
      '<div class="sPrice">' + it.p.toLocaleString('ru') + ' 💰</div>';
    card.onclick = () => {
      if (state.balance < it.p){ toast('Недостаточно монет 💰'); return; }
      state.balance -= it.p;
      state.inventory.push(it);
      save(); updateHUD(); checkAchievements();
      toast('Куплено: ' + it.n);
      blip(880, .12, 'sine', .08);
      vibrate(40);
    };
    g.appendChild(card);
  });
  $('modalScreen').classList.add('show');
}

      '<div class="achReward">' + (done ? '✓' : '+' + a.r + '💰') + '</div>' +

  const body = $('modalBody');

      '<div class="statRow"><div class="sLbl">Баланс</div><div class="sVal">' + Math.round(state.balance).toLocaleString('ru') + ' 💰</div></div>' +
    '</div>' +
    '<div class="modalSection"><h3>АКТИВНОСТЬ</h3>' +

      '<div class="statRow"><div class="sLbl">Потрачено</div><div class="sVal">' + state.stats.spent.toLocaleString('ru') + ' 💰</div></div>' +
      '<div class="statRow"><div class="sLbl">Заработано</div><div class="sVal">' + state.stats.earned.toLocaleString('ru') + ' 💰</div></div>' +
      '<div class="statRow"><div class="sLbl">Продано</div><div class="sVal">' + state.stats.sold + ' шт</div></div>' +
      '<div class="statRow"><div class="sLbl">Апгрейдов</div><div class="sVal">' + state.stats.upgraded + '</div></div>' +
      '<div class="statRow"><div class="sLbl">Контрактов</div><div class="sVal">' + state.stats.contracts + '</div></div>' +
    '</div>' +
    '<div class="modalSection"><h3>ИНВЕНТАРЬ</h3>' +
      '<div class="statRow"><div class="sLbl">Предметов</div><div class="sVal">' + state.inventory.length + '</div></div>' +
      '<div class="statRow"><div class="sLbl">Стоимость</div><div class="sVal">' + invVal.toLocaleString('ru') + ' 💰</div></div>' +
      '<div class="statRow"><div class="sLbl">Лучший дроп</div><div class="sVal" style="font-size:11px;text-align:right">' +
        (best ? best.e + ' ' + best.n + '<br><span style="color:#ffd76a">' + best.p.toLocaleString('ru') + ' 💰</span>' : '—') +
      '</div></div>' +
    '</div>';
  $('modalScreen').classList.add('show');
}

/* ============ ПРОМОКОД ============ */
function showPromo(){
  $('modalTitle').textContent = '🎟️ Промокод';
  const body = $('modalBody');
  body.innerHTML =
    '<div class="modalSection">' +
      '<input class="promoInput" id="promoInput" placeholder="ВВЕДИ КОД" maxlength="20" autocomplete="off">' +
      '<button class="btn" id="promoApply">АКТИВИРОВАТЬ</button>' +
    '</div>' +
    '<div style="font-size:11px;opacity:.5;text-align:center;line-height:1.6;padding:10px">' +
      'Попробуй: WELCOME, CS2, GOLD, UPGRADE, CONTRACT, FREE' +
    '</div>';
  $('modalScreen').classList.add('show');
  setTimeout(() => {
    const inp = $('promoInput');
    const btn = $('promoApply');
    if (inp) inp.focus();
    if (btn) btn.onclick = () => {
      const code = (inp.value || '').trim().toUpperCase();
      if (!code) return;
      if (!PROMOS[code]){ toast('❌ Неверный код'); vibrate(80); return; }
      if (state.promo[code]){ toast('Код уже использован'); return; }
      const p = PROMOS[code];
      state.promo[code] = true;
      if (p.coins) state.balance += p.coins;
      if (p.item){
        const it = ITEMS.find(i => i.id === p.item);
        if (it) state.inventory.push(it);
      }
      save(); updateHUD(); checkAchievements();
      toast('✅ Активировано: ' + p.label);
      blip(880, .12, 'sine', .09);
      setTimeout(() => blip(1180, .16, 'sine', .09), 100);
      vibrate([40, 30, 40]);
      $('modalScreen').classList.remove('show');
    };
  }, 30);
}

/* ============ ЕЖЕДНЕВНЫЙ БОНУС ============ */
const DAILY_REWARDS = [100, 200, 300, 500, 800, 1200, 2000];
function checkDaily(){
  const today = new Date().toDateString();
  if (state.stats.lastDaily === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (state.stats.lastDaily !== yesterday && state.stats.lastDaily !== ''){
    state.stats.dailyStreak = 0;
  }
  showDaily();
}
function showDaily(){
  const today = new Date().toDateString();
  const claimed = state.stats.lastDaily === today;
  const currentStreak = claimed ? state.stats.dailyStreak - 1 : state.stats.dailyStreak;
  const grid = $('dayGrid');
  grid.innerHTML = '';
  DAILY_REWARDS.forEach((r, i) => {
    const cell = document.createElement('div');
    let cls = 'dayCell';
    if (i < currentStreak) cls += ' done';
    else if (i === currentStreak && !claimed) cls += ' today';
    cell.className = cls;
    cell.innerHTML = '<div class="dn">День ' + (i+1) + '</div>' +
      '<div class="dr">' + r + '</div>';
    grid.appendChild(cell);
  });
  $('claimDailyBtn').style.display = claimed ? 'none' : 'block';
  $('claimDailyBtn').textContent = 'ЗАБРАТЬ ' + DAILY_REWARDS[Math.min(currentStreak, 6)] + ' 💰';
  $('closeDailyBtn').textContent = claimed ? 'Закрыть' : 'Позже';
  $('dailyScreen').classList.add('show');
}
$('claimDailyBtn').onclick = () => {
  const idx = Math.min(state.stats.dailyStreak, 6);
  const reward = DAILY_REWARDS[idx];
  state.balance += reward;
  state.stats.dailyStreak = Math.min(state.stats.dailyStreak + 1, 7);
  state.stats.lastDaily = new Date().toDateString();
  save(); updateHUD(); checkAchievements();
  toast('+' + reward + ' 💰 ежедневный бонус!');
  blip(880, .12, 'sine', .09);
  setTimeout(() => blip(1180, .16, 'sine', .09), 100);
  vibrate([40, 30, 80]);
  showDaily();
  setTimeout(() => $('dailyScreen').classList.remove('show'), 900);
};
$('closeDailyBtn').onclick = () => $('dailyScreen').classList.remove('show');
$('dailyBtn').onclick = () => {
  const today = new Date().toDateString();
  if (state.stats.lastDaily === today) return;
  showDaily();
};

/* ============ МЕНЮ ============ */
$('menuShop').onclick = showShop;
$('menuAch').onclick = showAch;
$('menuStats').onclick = showStats;
$('menuPromo').onclick = showPromo;

  if (!confirm('Сбросить весь прогресс? Это действие необратимо.')) return;
  localStorage.removeItem('cs2pro_v2');
  location.reload();
};

/* ============ MODAL CLOSE ============ */
$('modalClose').onclick = () => $('modalScreen').classList.remove('show');

/* ============ ТОСТ ============ */
let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
renderTabs();
renderCases();
updateHUD();
setTimeout(checkDaily, 500);
</script>
