<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Подбор меню · продукты и цены</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --accent:#16a34a; --accent-soft:#e7f8ec;
    --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --radius:16px;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px -12px rgba(15,23,42,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  .app{max-width:820px;margin:0 auto;padding:20px 16px 120px}
  header h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .progress{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:22px}
  .progress > i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s ease}

  h2{font-size:19px;margin:0 0 4px}
  h3{font-size:16px;margin:26px 0 10px}
  .hint{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.45}
  .note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:16px}

  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .option{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1.5px solid var(--border);background:var(--card);border-radius:var(--radius);cursor:pointer;transition:.15s;font:inherit;color:inherit;text-align:left;box-shadow:var(--shadow)}
  .option:hover{border-color:#cbd5e1;transform:translateY(-1px)}
  .option.active{border-color:var(--accent);background:var(--accent-soft)}
  .option .emoji{font-size:20px}
  .option .check{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto;display:grid;place-items:center;font-size:12px;color:#fff;line-height:1}
  .option.active .check{background:var(--accent);border-color:var(--accent)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 16px;border-radius:99px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font:inherit;font-size:14px;transition:.15s}
  .chip:hover{border-color:#cbd5e1}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .link{display:inline-block;margin-top:12px;background:none;border:none;padding:0;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline}

  .budget-box{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
  .budget-value{font-size:38px;font-weight:700;line-height:1;margin-bottom:18px}
  .budget-value small{font-size:16px;color:var(--muted);font-weight:500}
  input[type=range]{width:100%;accent-color:var(--accent);height:28px;cursor:pointer}
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .field-label{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:500}

  .summary{background:var(--accent-soft);border-radius:var(--radius);padding:14px 16px;font-size:14px;line-height:1.6}
  .summary b{font-weight:600}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}
  .stat{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px}
  .stat-val{font-size:22px;font-weight:700;line-height:1.1;margin-bottom:4px;word-break:break-word}
  .stat-lbl{font-size:12.5px;color:var(--muted)}

  .menu-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
  .menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
  .menu-head .price{color:var(--accent);font-size:16px}
  .menu-day{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 4px;font-weight:600}
  .menu-item{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;border-bottom:1px dashed var(--border)}
  .menu-item:last-child{border-bottom:none}
  .menu-item .n{color:var(--muted);font-size:12px;margin-right:6px;min-width:52px;display:inline-block}
  .menu-item .p{white-space:nowrap;color:var(--muted);font-size:13px}

  .dish{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;margin-bottom:8px}
  .dish-emoji{font-size:22px;flex:0 0 auto}
  .dish-body{flex:1;min-width:0}
  .dish-name{font-weight:600;font-size:14.5px;margin-bottom:2px}
  .dish-meta{color:var(--muted);font-size:12px;line-height:1.4}
  .dish-price{font-weight:700;font-size:15px;white-space:nowrap}

  .total{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border:1.5px dashed var(--accent);border-radius:var(--radius);font-weight:600;margin-top:10px}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);background:var(--card);border-radius:var(--radius);border:1.5px dashed var(--border)}

  .footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:12px 16px}
  .footer-inner{max-width:820px;margin:0 auto;display:flex;gap:10px}
  .btn-primary{flex:1;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.15s}
  .btn-primary:hover:not(:disabled){background:#15803d}
  .btn-primary:disabled{background:#cbd5e1;cursor:not-allowed}
  .btn-ghost{padding:14px 20px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font:inherit;font-size:16px;font-weight:500;cursor:pointer}
  .btn-ghost:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>

    <div class="progress"><i id="bar"></i></div>
  </header>
  <main id="main"></main>
</div>

<div class="footer">
  <div class="footer-inner">

/* ═══════════════════════════════════════════════════════════════════
   СПРАВОЧНИКИ ФИЛЬТРОВ
   ═══════════════════════════════════════════════════════════════════ */
const ALLERGENS = [
  {id:'nuts',    name:'Орехи'},
  {id:'milk',    name:'Молоко'},
  {id:'gluten',  name:'Глютен'},
  {id:'eggs',    name:'Яйца'},
  {id:'soy',     name:'Соя'},
  {id:'fish',    name:'Рыба'},
  {id:'seafood', name:'Морепродукты'},
];
const EXCLUDES = [
  {id:'fish',      name:'Рыба'},
  {id:'seafood',   name:'Морепродукты'},
  {id:'pork',      name:'Свинина'},
  {id:'beef',      name:'Говядина'},
  {id:'chicken',   name:'Курица'},
  {id:'meat',      name:'Любое мясо'},
  {id:'spicy',     name:'Острое'},
  {id:'mushrooms', name:'Грибы'},
  {id:'veg',       name:'Вегетарианское'},
];

/* ═══════════════════════════════════════════════════════════════════
   СОСТОЯНИЕ И УТИЛИТЫ
   ═══════════════════════════════════════════════════════════════════ */
const state = {
  step: 0,
  stores: [],
  allergies: [],
  exclude: [],
  budget: 5000,
  days: 3,
};

const DAY_OPTIONS = [1, 3, 7];
const money = n => new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽';
const toggle = (arr, v) => { const i = arr.indexOf(v); i === -1 ? arr.push(v) : arr.splice(i,1); };
const nameOf = (list, id) => (list.find(x => x.id === id) || {}).name || id;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ═══════════════════════════════════════════════════════════════════
   ЦЕНА БЛЮДА В МАГАЗИНАХ (по ингредиентам), берём минимальную
   ═══════════════════════════════════════════════════════════════════ */
function recipePrice(recipe, storeId) {
  const mult = (STORES.find(s => s.id === storeId) || {mult:1}).mult;
  let total = 0;
  for (const item of recipe.ing) {
    const prod = PRODUCTS[item.p];
    if (!prod) continue;
    if (prod.unit === 'kg' || prod.unit === 'L') total += (item.g / 1000) * prod.price;
    else total += item.g * prod.price;
  }
  return Math.round(total * mult / 10) * 10;
}

function recipeCheapestPrice(recipe) {
  if (!state.stores.length) return 0;
  return Math.min(...state.stores.map(sid => recipePrice(recipe, sid)));
}

/* ═══════════════════════════════════════════════════════════════════
   ФИЛЬТРАЦИЯ БЛЮД
   ═══════════════════════════════════════════════════════════════════ */
function filterRecipes() {
  const list = [];
  for (const r of RECIPES) {
    if (r.allergens.some(a => state.allergies.includes(a))) continue;
    if (r.tags.some(t => state.exclude.includes(t))) continue;
    list.push({...r, price: recipeCheapestPrice(r)});
  }
  return list;
}

/* ═══════════════════════════════════════════════════════════════════
   ГЕНЕРАЦИЯ ПРИМЕРОВ МЕНЮ
   Меню на день = завтрак + суп + горячее + салат (4 блюда)
   ═══════════════════════════════════════════════════════════════════ */
function buildSamples(valid, days, budget, count = 6) {
  const b = valid.filter(r => r.cat === 'breakfast');
  const s = valid.filter(r => r.cat === 'soup');
  const m = valid.filter(r => r.cat === 'main');
  const sal = valid.filter(r => r.cat === 'salad');
  if (!b.length || !s.length || !m.length || !sal.length) return [];

  const candidates = [];
  const tries = 4000;
  for (let i = 0; i < tries; i++) {
    const plan = [];
    let total = 0;
    for (let d = 0; d < days; d++) {
      const day = [
        {type:'Завтрак', dish: pick(b)},
        {type:'Суп',     dish: pick(s)},
        {type:'Горячее', dish: pick(m)},
        {type:'Салат',   dish: pick(sal)},
      ];
      plan.push(day);
      for (const x of day) total += x.dish.price;
    }
    if (total <= budget && total >= budget * 0.55) {
      candidates.push({plan, total});
    }
  }
  candidates.sort((a,b) => b.total - a.total);
  // убираем дубли по набору id
  const seen = new Set();
  const out = [];
  for (const c of candidates) {
    const key = c.plan.flatMap(d => d.map(x => x.dish.id)).join('|');
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(c);
    if (out.length >= count) break;
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════════════
   РЕНДЕР ШАГОВ
   ═══════════════════════════════════════════════════════════════════ */
function renderStores() {
  const all = state.stores.length === STORES.length;
  return `
    <h2>Шаг 1. Где закупаемся?</h2>
    <p class="hint">Выберите один или несколько магазинов. У каждого свой ценовой коэффициент — итоговая цена блюда берётся по самому выгодному.</p>
    <div class="grid">
      ${STORES.map(s => {
        const on = state.stores.includes(s.id);
        return `<button class="option ${on?'active':''}" data-act="store" data-val="${s.id}">
          <span class="emoji">${s.emoji}</span>
          <span>${s.name}</span>
          <span class="check">${on?'✓':''}</span>
        </button>`;
      }).join('')}
    </div>
    <button class="link" data-act="allstores">${all?'Снять выбор':'Выбрать все'}</button>
  `;
}

function renderAllergies() {
  return `
    <h2>Шаг 2. Есть ли аллергии?</h2>
    <p class="hint">Блюда с этими аллергенами полностью исключим. Нет аллергий — просто жмите «Далее».</p>
    <div class="chips">
      ${ALLERGENS.map(a => `
        <button class="chip ${state.allergies.includes(a.id)?'active':''}" data-act="allergy" data-val="${a.id}">${a.name}</button>
      `).join('')}
    </div>
  `;
}

function renderExcludes() {
  return `
    <h2>Шаг 3. Чего не хотите в меню?</h2>
    <p class="hint">Вкусы и продукты, которые не любите.</p>
    <div class="chips">
      ${EXCLUDES.map(a => `
        <button class="chip ${state.exclude.includes(a.id)?'active':''}" data-act="exclude" data-val="${a.id}">${a.name}</button>
      `).join('')}
    </div>
  `;
}

function renderBudget() {
  const quick = [1000, 3000, 5000, 10000, 25000];
  return `
    <h2>Шаг 4. Бюджет и длина плана</h2>
    <p class="hint">Сумма — на весь план. В день — 4 блюда: завтрак, суп, горячее, салат.</p>
    <div class="budget-box">
      <div class="budget-value" id="budgetValue">${state.budget} <small>₽</small></div>
      <input type="range" id="budgetRange" min="1000" max="25000" step="500" value="${state.budget}">
      <div class="quick">
        ${quick.map(v => `<button class="chip ${state.budget===v?'active':''}" data-act="budget" data-val="${v}">${v} ₽</button>`).join('')}
      </div>
    </div>
    <p class="field-label">Длина плана</p>
    <div class="chips">
      ${DAY_OPTIONS.map(d => `
        <button class="chip ${state.days===d?'active':''}" data-act="days" data-val="${d}">
          ${d} ${d===1?'день':d<5?'дня':'дней'}
        </button>
      `).join('')}
    </div>
  `;
}

function renderResults() {
  const valid = filterRecipes();
  const byCat = {
    breakfast: valid.filter(r => r.cat==='breakfast'),
    soup:      valid.filter(r => r.cat==='soup'),
    main:      valid.filter(r => r.cat==='main'),
    salad:     valid.filter(r => r.cat==='salad'),
  };

  const chips = [];
  if (state.stores.length) chips.push('Магазины: <b>' + state.stores.map(s => nameOf(STORES, s)).join(', ') + '</b>');
  chips.push('Аллергии: <b>' + (state.allergies.length ? state.allergies.map(a => nameOf(ALLERGENS, a)).join(', ') : 'нет') + '</b>');
  chips.push('Исключено: <b>' + (state.exclude.length ? state.exclude.map(a => nameOf(EXCLUDES, a)).join(', ') : 'ничего') + '</b>');
  chips.push('Бюджет: <b>' + money(state.budget) + '</b> · план: <b>' + state.days + ' ' + (state.days===1?'день':state.days<5?'дня':'дней') + '</b>');

  if (!valid.length) {
    return `
      <h2>Ничего не нашлось 😔</h2>
      <div class="summary">${chips.join('<br>')}</div>
      <div class="empty" style="margin-top:16px">Попробуйте увеличить бюджет, добавить магазин или убрать один из фильтров.</div>
    `;
  }

  const perDay = BigInt(byCat.breakfast.length) * BigInt(byCat.soup.length) * BigInt(byCat.main.length) * BigInt(byCat.salad.length);
  const totalCombos = perDay === 0n ? 0n : perDay ** BigInt(state.days);
  const totalFormatted = totalCombos.toLocaleString('ru-RU');

  const samples = buildSamples(valid, state.days, state.budget, 6);

  return `
    <h2>Готово! Подобрано блюд: ${valid.length}</h2>
    <div class="summary">${chips.join('<br>')}</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-val">${perDay.toLocaleString('ru-RU')}</div>
        <div class="stat-lbl">комбинаций на 1 день (завтрак × суп × горячее × салат)</div>
      </div>
      <div class="stat">
        <div class="stat-val">${totalFormatted}</div>
        <div class="stat-lbl">комбинаций на план из ${state.days} ${state.days===1?'дня':state.days<5?'дней':'дней'}</div>
      </div>
      <div class="stat">
        <div class="stat-val">${valid.length}</div>
        <div class="stat-lbl">блюд доступно после фильтров</div>
      </div>
    </div>

    <h3>🍽 Примеры меню в рамках бюджета</h3>
    ${samples.length ? samples.map(s => `
      <div class="menu-card">
        <div class="menu-head">
          <span>Вариант · ${state.days} ${state.days===1?'день':state.days<5?'дня':'дней'}</span>
          <span class="price">${money(s.total)}</span>
        </div>
        ${s.plan.map((day, i) => `
          ${state.days > 1 ? `<div class="menu-day">День ${i+1}</div>` : ''}
          ${day.map(x => `
            <div class="menu-item">
              <span><span class="n">${x.type}</span>${x.dish.emoji} ${x.dish.name}</span>
              <span class="p">${money(x.dish.price)}</span>
            </div>
          `).join('')}
        `).join('')}
      </div>
    `).join('') : `<div class="empty">В этот бюджет примеры меню не помещаются. Увеличьте бюджет или сократите план.</div>`}

    <h3>📋 Все доступные блюда</h3>
    ${['breakfast','soup','main','salad'].map(cat => {
      const label = {breakfast:'Завтраки', soup:'Супы', main:'Горячее', salad:'Салаты'}[cat];
      const list = byCat[cat].slice().sort((a,b) => a.price - b.price);
      if (!list.length) return '';
      return `
        <div style="font-weight:600;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px">${label} · ${list.length}</div>
        ${list.map(d => `
          <div class="dish">
            <div class="dish-emoji">${d.emoji}</div>
            <div class="dish-body">
              <div class="dish-name">${d.name}</div>
              <div class="dish-meta">${d.ing.map(i => PRODUCTS[i.p].name).join(' · ')}</div>
            </div>
            <div class="dish-price">${money(d.price)}</div>
          </div>
        `).join('')}
      `;
    }).join('')}
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   УПРАВЛЕНИЕ
   ═══════════════════════════════════════════════════════════════════ */
const STEPS = [renderStores, renderAllergies, renderExcludes, renderBudget];
const main = document.getElementById('main');
const backBtn = document.getElementById('back');
const nextBtn = document.getElementById('next');
const bar = document.getElementById('bar');

const canGoNext = () => state.step === 0 ? state.stores.length > 0 : true;

function render() {
  main.innerHTML = state.step === 4 ? renderResults() : STEPS[state.step]();
  const pct = state.step === 4 ? 100 : ((state.step + 1) / 4) * 100;
  bar.style.width = pct + '%';

  if (state.step === 4) {
    backBtn.textContent = 'Заново';
    backBtn.disabled = false;
    nextBtn.textContent = 'Изменить условия';
  } else {
    backBtn.textContent = 'Назад';
    backBtn.disabled = state.step === 0;
    nextBtn.textContent = state.step === 3 ? 'Подобрать' : 'Далее';
    nextBtn.disabled = !canGoNext();
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

nextBtn.addEventListener('click', () => {
  if (state.step === 4) { state.step = 0; render(); return; }
  if (state.step === 3) { state.step = 4; render(); return; }
  state.step++; render();
});
backBtn.addEventListener('click', () => {
  if (state.step === 4) { state.step = 0; render(); return; }
  if (state.step > 0) { state.step--; render(); }
});

main.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, val } = el.dataset;
  if (act === 'store')     toggle(state.stores, val);
  if (act === 'allergy')   toggle(state.allergies, val);
  if (act === 'exclude')   toggle(state.exclude, val);
  if (act === 'budget')    state.budget = +val;
  if (act === 'days')      state.days = +val;
  if (act === 'allstores') state.stores = state.stores.length === STORES.length ? [] : STORES.map(s => s.id);
  render();
});

main.addEventListener('input', e => {
  if (e.target.id !== 'budgetRange') return;
  state.budget = +e.target.value;
  document.getElementById('budgetValue').innerHTML = state.budget + ' <small>₽</small>';
  main.querySelectorAll('[data-act="budget"]').forEach(b => {
    b.classList.toggle('active', +b.dataset.val === state.budget);
  });
});

render();
</script>
